[project]
name = "who2be"
version = "0"
description = "Who2Be — self-hosted AgentDB for versioned persona and playbook management"
requires-python = ">=3.11"
license = { text = "FSL-1.1-Apache-2.0" }
authors = [{ name = "Yannick Lützenburg", email = "luetzey@gmail.com" }]

[tool.uv]
package = false

# Glob fuer `packages/*`: der On-Prem-Build kopiert `packages/billing` bewusst NICHT
# in den Build-Context (Build-Zeit-Isolation, ADR-0029) — die Glob-Discovery
# toleriert das fehlende Member, statt zu scheitern.
[tool.uv.workspace]
members = ["apps/api", "apps/mcp", "packages/*"]

[tool.uv.sources]
who2be-api = { workspace = true }
who2be-mcp = { workspace = true }
who2be-models = { workspace = true }
who2be-billing = { workspace = true }

[dependency-groups]
# `dev` = Kern (On-Prem-Surface). `billing` ist eine SEPARATE, optionale Gruppe —
# nur die Cloud-Edition synct sie (`uv sync --group billing`). So landet das
# Mollie-SDK nie im On-Prem-Artefakt.
dev = [
    "who2be-api",
    "who2be-mcp",
    "who2be-models",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.15.16",
]
billing = [
    "who2be-billing",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api/src", "apps/mcp/src", "packages/models/src", "packages/billing/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["apps/api/src", "apps/mcp/src", "packages/models/src", "packages/billing/src"]

# asyncpg + die Mollie-SDK liefern keine vollstaendigen Typ-Stubs — bewusste, eng
# begrenzte Ausnahme; unser eigener Code bleibt strict.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "mollie.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/mcp/tests", "packages/models/tests", "packages/billing/tests"]
# `--strict-markers`: ein vertippter/unbekannter Marker (z. B. `@pytest.mark.integraton`)
# bricht statt still zu rutschen — Voraussetzung fuer den zentralen Integration-Skip
# in `conftest.py` und den CI-Skip-Guard (`WHO2BE_REQUIRE_DB`).
addopts = ["--strict-markers"]
markers = [
    "integration: Test benoetigt eine erreichbare Datenbank (DB). Zentral in conftest.py uebersprungen, wenn keine DB erreichbar ist; mit WHO2BE_REQUIRE_DB=1 (CI) schlaegt der fehlende DB-Zugriff stattdessen hart fehl.",
]

# --- Coverage (ADR-0032) -----------------------------------------------------
# Gemessen ueber die importierbaren Paketnamen (editable installs zeigen auf die
# jeweiligen src/-Baeume). `--cov` zieht diese Config; der Ratchet-Floor laeuft in
# CI via `--cov-fail-under`. branch=true, damit der Floor auch Zweige abdeckt.
[tool.coverage.run]
branch = true
source = ["who2be_api", "who2be_mcp", "who2be_models", "who2be_billing"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]
