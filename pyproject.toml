[project]
name = "who2be"
version = "0"
description = "Who2Be — self-hosted AgentDB for versioned persona and playbook management"
requires-python = ">=3.11"
license = { text = "FSL-1.1-Apache-2.0" }
authors = [{ name = "Yannick Lützenburg", email = "luetzey@gmail.com" }]

[tool.uv]
package = false

# Glob fuer `packages/*`: der On-Prem-Build kopiert `packages/billing` bewusst NICHT
# in den Build-Context (Build-Zeit-Isolation, ADR-0029) — die Glob-Discovery
# toleriert das fehlende Member, statt zu scheitern.
[tool.uv.workspace]
members = ["apps/api", "apps/mcp", "packages/*"]

[tool.uv.sources]
who2be-api = { workspace = true }
who2be-mcp = { workspace = true }
who2be-models = { workspace = true }
who2be-billing = { workspace = true }

[dependency-groups]
# `dev` = Kern (On-Prem-Surface). `billing` ist eine SEPARATE, optionale Gruppe —
# nur die Cloud-Edition synct sie (`uv sync --group billing`). So landet das
# Mollie-SDK nie im On-Prem-Artefakt.
dev = [
    "who2be-api",
    "who2be-mcp",
    "who2be-models",
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.15.16",
]
billing = [
    "who2be-billing",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api/src", "apps/mcp/src", "packages/models/src", "packages/billing/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["apps/api/src", "apps/mcp/src", "packages/models/src", "packages/billing/src"]

# asyncpg + die Mollie-SDK liefern keine vollstaendigen Typ-Stubs — bewusste, eng
# begrenzte Ausnahme; unser eigener Code bleibt strict.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "mollie.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/mcp/tests", "packages/models/tests", "packages/billing/tests"]
markers = [
    "integration: Test benoetigt eine erreichbare Datenbank",
]
