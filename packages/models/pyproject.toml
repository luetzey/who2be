[project]
name = "who2be-models"
version = "0.1.0"
description = "Shared Pydantic models for Who2Be (API + MCP)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/who2be_models"]
