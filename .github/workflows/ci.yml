name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded Runs desselben Refs abbrechen, statt sie parallel zu Ende laufen
# zu lassen. Spart GitHub-Actions-Minuten (relevant fuer das Minuten-Kontingent
# privater Repos) und haelt die Run-Historie pro Branch sauber. main wird nicht
# abgebrochen (push-Events auf main behalten ihren Lauf via run_id-Gruppe).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Gate-Job (siehe Issue): klassifiziert den PR-Diff und steuert per `if:`,
    # ob die vier schweren Jobs unten laufen. Bewusst `if:` statt
    # `paths-ignore` am Trigger — ein per `paths-ignore` gar nicht gestarteter
    # Workflow meldet KEINEN Check-Status (Required Checks blieben auf
    # "Expected" stehen); ein per `if:` uebersprungener Job meldet "skipped",
    # was GitHub bei Required Checks wie Erfolg wertet. Bewusst `git diff`
    # statt einer Fremd-Action (z. B. dorny/paths-filter) — alle `uses:` in
    # diesem Workflow sind SHA-gepinnt, eine weitere Action waere zusaetzliche
    # Supply-Chain-Flaeche fuer fuenf Zeilen Shell. Gilt NUR fuer
    # `pull_request`: ein Push auf `main` faehrt immer den vollen Satz, weil
    # main die Release-Basis ist und ein Tag auf einem Commit sitzen soll,
    # dessen Suite tatsaechlich gelaufen ist. `audit` haengt bewusst nicht an
    # diesem Gate (fragt eine Live-CVE-Datenbank ab, kann sich ohne
    # Datei-Aenderung aendern).
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify diff (docs-only PRs skip the heavy jobs)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          # Fail-safe durchgaengig: jeder Fehler-/Sonderpfad hier endet in
          # code=true (voller Lauf). Ein faelschliches "skip" waere ein
          # stilles falsches Gruen - der einzige teure Fehler dieser
          # Klassifikation. Nur ein sauber bestimmter, ausschliesslich aus
          # Doku bestehender Diff ergibt code=false.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || {
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          DIFF=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA") || {
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "$DIFF" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Allowlist "nur Doku": .claude/**, docs/** (inkl.
          # docs/reference/openapi.json), Markdown im Repo-Root. Jede Zeile,
          # die NICHT auf die Allowlist passt, kippt code auf true.
          if echo "$DIFF" | grep -vqE '^(\.claude/|docs/|[A-Za-z0-9._-]+\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-Variante (ADR-0046) — Migration 0071 legt die
        # `vector`-Extension an, die `postgres:16` nicht mitbringt.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: who2be
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Sync dependencies
        # `--group billing` installiert das optionale Cloud-Billing-Paket, damit
        # dessen Tests + Typecheck laufen. Die Build-Zeit-Isolation (kein Mollie
        # im On-Prem-Artefakt) wird im Docker-Build erzwungen, nicht hier.
        run: uv sync --group billing
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy .
      - name: OpenAPI-Referenz aktuell (Drift-Gate)
        # `docs/reference/openapi.json` ist die eingecheckte API-Referenz
        # (spec-first, Dokumentations-Standards). Der Contract-Test
        # `test_openapi_contract.py` friert nur die OBERFLAECHE ein (Methode,
        # Pfad, operationId) — Schema-Aenderungen lassen ihn gruen. Genau so
        # ist die Referenz waehrend der sechs #402-Wellen veraltet, ohne dass
        # etwas rot wurde (#498). Dieser Schritt schliesst die Luecke: er
        # regeneriert und vergleicht. Er steht VOR dem Test-Schritt, weil er
        # Sekunden braucht und die Suite Minuten — ein schneller Fehlschlag
        # spart den teuren Lauf. Braucht keine DB (reiner Schema-Aufbau).
        run: |
          uv run python scripts/export_openapi.py
          if ! git diff --exit-code docs/reference/openapi.json; then
            echo "::error file=docs/reference/openapi.json::Die eingecheckte OpenAPI-Referenz weicht von der App ab. Behebung: 'uv run python scripts/export_openapi.py' ausfuehren und die Datei mitcommitten."
            exit 1
          fi
      - name: License check (Python · Deny-Liste)
        # OSS-License-Compliance (ADR-0033): fail-closed gegen Copyleft/AGPL.
        # Deny-Liste statt Allow-Liste — geringe False-Positive-Rate, wartungsarm
        # (neue permissive Deps brauchen keine Pflege). MPL-2.0 (file-level,
        # z. B. certifi) bleibt bewusst erlaubt. Laeuft hier, weil die Deps im
        # python-Job bereits via `uv sync --group billing` installiert sind.
        run: >-
          uv run --with pip-licenses python -m piplicenses --partial-match
          --fail-on "GPL;AGPL;LGPL;SSPL;CDDL;EPL;EUPL;OSL;CPL;CPAL;NPL;Sleepycat;UNKNOWN"
      - name: Test (coverage ratchet + DB-Skip-Guard)
        # WHO2BE_REQUIRE_DB=1: ohne erreichbare DB bricht die Suite hart ab
        # (conftest.py, ADR-0041) — kein stilles "gruen durch Skip" mehr.
        # --cov-fail-under: Ratchet-Floor. CI-gemessen (722 Tests inkl. DB):
        # 86.92 % -> Floor 85 (2 Pkt Headroom). Anhebung nur in Coverage-PRs.
        env:
          WHO2BE_REQUIRE_DB: "1"
        run: >-
          uv run pytest -q --cov --cov-report=term-missing
          --cov-report=xml --cov-fail-under=85
          --junitxml=junit-python.xml
      - name: Skip-Budget-Gate (uebersprungen != bestanden)
        # Zweite Verteidigungslinie hinter WHO2BE_REQUIRE_DB. Der Guard in
        # conftest.py deckt nur `@pytest.mark.integration` ab; jeder andere
        # Skip-Pfad (inline `pytest.skip`, fehlender Marker, importorskip)
        # rutscht an ihm vorbei und macht den Lauf still gruen. Dieser Step
        # wertet die JUnit-XML aus — sie nennt je Test den Skip-GRUND, die
        # `-q`-Zusammenfassung nur eine Zahl; Textparsing waere ausserdem an
        # das Ausgabeformat gekoppelt. `if: always()`, damit ein roter
        # Test-Step das Gate nicht verschluckt: beide Befunde sollen im selben
        # Lauf sichtbar sein. Der Step haengt bewusst im `python`-Job und
        # nicht in einem eigenen Job daneben — `python` ist Vorgaenger des
        # kuenftigen Aggregat-Jobs, ein Verstoss faerbt also das Tor rot, und
        # die XML muesste sonst als Artefakt herumgereicht werden.
        if: always()
        run: python3 scripts/ci/assert_skips_within_budget.py junit-python.xml
      - name: Upload Python JUnit-XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-python
          path: junit-python.xml
          if-no-files-found: ignore
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Test (coverage ratchet)
        # `test:coverage` faehrt die volle Vitest-Suite mit v8-Coverage und
        # erzwingt die Thresholds aus vite.config.ts (Floor, ADR-0041).
        run: npm run test:coverage
      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: ignore
      - name: A11y (axe via vitest)
        # Eigenes Gate: A11y-Tests laufen bereits unter `npm test` mit, hier
        # gefiltert (`testNamePattern a11y`) als sichtbarer Step. Bricht den
        # Build sofort, wenn axe Violations meldet — keine Regress-Lecks.
        run: npm run test:a11y
      - name: Build
        run: npm run build
      - name: Assert on-prem bundle excludes Billing-UI (ADR-0029)
        # Default-Build = On-Prem (kein VITE_WHO2BE_EDITION) → features/billing
        # muss aus dem Bundle tree-geshaked sein. Marker: BillingPanel-Strings
        # aus features/billing/i18n.ts — identisches Set wie im Cloud-Positiv-
        # Assert unten, damit Marker-Drift dort auffaellt (DEP-6).
        run: |
          if grep -rlE "Jetzt upgraden|MCP-Reads diesen Monat" dist; then
            echo "::error::Billing-UI ist ins On-Prem-Bundle gelangt"; exit 1
          fi
          echo "OK: Billing-UI nicht im On-Prem-Bundle."
      - name: Build (cloud) + assert bundle includes Billing-UI (DEP-6)
        # Gegenprobe zum On-Prem-Assert: mit VITE_WHO2BE_EDITION=cloud MUESSEN
        # dieselben Marker im Bundle auftauchen — sonst ist das Negativ-Assert
        # ein No-Op (stale Marker) oder das Cloud-Web-Bundle kaputt (DEP-1).
        # `npx vite build` ohne `tsc -b` (Typecheck lief oben schon); eigenes
        # outDir, damit das On-Prem-dist fuer Folge-Steps unangetastet bleibt.
        env:
          VITE_WHO2BE_EDITION: cloud
        run: |
          npx vite build --outDir dist-cloud
          for marker in "Jetzt upgraden" "MCP-Reads diesen Monat"; do
            if ! grep -rq "$marker" dist-cloud; then
              echo "::error::Marker '$marker' fehlt im Cloud-Bundle"; exit 1
            fi
          done
          echo "OK: Billing-UI im Cloud-Bundle."

  compose-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose env
        run: cp .env.example .env
      - name: Basis-Images vorziehen (Docker Hub bricht Verbindungen ab)
        run: scripts/ci/compose-pull-retry.sh
      - name: Compose up (build + wait healthy)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke
        run: bash scripts/smoke.sh
      - name: Build runtime-cloud image (ADR-0029, build-only)
        # Cloud-Profil-Gegenprobe (LIC-4): das Docker-Target `runtime-cloud`
        # (inkl. who2be-billing) wurde in CI sonst nie gebaut — ein Bruch
        # fiele erst beim Deploy auf. Kein Push, kein Start. Haengt an diesem
        # Job, weil der Compose-Build oben den Layer-Cache der gemeinsamen
        # Stages teilt (kein neuer Runner, Actions-Minuten schonen).
        run: docker build --target runtime-cloud -f apps/api/Dockerfile .
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Compose down
        if: always()
        run: docker compose down -v

  e2e:
    # Duenne E2E-Spitze (ADR-0041, Phase 4): Playwright gegen den echten
    # Compose-Stack (Web :5173, API :8000). Hartes Gate seit 2026-08-20:
    # die vier Journeys sind scharf und liefen gruen durch (Run 32377333096)
    # — das fruehere Soft-Gate (`continue-on-error`) ist damit entfernt
    # (#341 WP-9).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose env
        run: cp .env.example .env
      - name: Basis-Images vorziehen (Docker Hub bricht Verbindungen ab)
        run: scripts/ci/compose-pull-retry.sh
      - name: Compose up (build + wait healthy)
        run: docker compose up -d --build --wait --wait-timeout 240
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: npm run e2e:install
      - name: Run E2E
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Compose down
        if: always()
        run: docker compose down -v

  e2e-billing-cloud:
    # Billing-Journey (Issue #453) — eigener, schmaler Job statt einer
    # Erweiterung des `e2e`-Jobs oben (Owner-Entscheidung 2026-09-06): der
    # `e2e`-Job baut den Stack im On-Prem-Default (`cp .env.example .env` +
    # `docker compose up` ohne Overlay); die Billing-UI existiert dort
    # physisch nicht (ADR-0029, Tree-Shaking), die Journey liefe dort
    # dauerhaft in ihren Datei-Skip (`apps/web/e2e/billing.spec.ts`,
    # `E2E_EDITION != cloud`). Dieser Job faehrt stattdessen NUR den Cloud-
    # Overlay (`docker-compose.cloud.yml`, setzt WHO2BE_EDITION +
    # VITE_WHO2BE_EDITION bereits auf `cloud`) hoch und NUR diese eine Spec —
    # er steht NEBEN dem `e2e`-Job, ersetzt ihn nicht und macht ihn nicht
    # langsamer. Der Checkout-Aufruf wird in der Spec per `page.route`
    # abgefangen — kein Mollie-Key noetig, `.env.example` reicht wie im
    # `compose-smoke`-/`e2e`-Job.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose env
        run: cp .env.example .env
      - name: Basis-Images vorziehen (Docker Hub bricht Verbindungen ab)
        run: >-
          scripts/ci/compose-pull-retry.sh
          -f docker-compose.yml -f docker-compose.cloud.yml
          -f docker-compose.e2e-cloud.yml
      - name: Compose up (cloud overlay + e2e overlay, build + wait healthy)
        # Drittes Overlay: docker-compose.e2e-cloud.yml stellt nur
        # GOTRUE_MAILER_AUTOCONFIRM="true" wieder her. Das Cloud-Overlay setzt
        # es bewusst auf "false" (echter Mailflow ueber mailpit), aber
        # `e2e/helpers/auth.ts::createUser` erwartet ein access_token direkt
        # aus der Signup-Antwort — ohne Autoconfirm gibt es das nicht, und der
        # erste Lauf dieses Jobs scheiterte genau daran (500 "Error sending
        # confirmation mail"). Editions-Konfiguration bleibt unberuehrt.
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.cloud.yml
          -f docker-compose.e2e-cloud.yml
          up -d --build --wait --wait-timeout 240
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: npm run e2e:install
      - name: Run Billing E2E (cloud, scharf)
        # E2E_EDITION=cloud ist das Signal, das die Datei-weite Skip-Guard in
        # billing.spec.ts aufhebt (siehe Kommentar dort) — ohne dieses Signal
        # (der normale `e2e`-Job oben) bleibt die Spec uebersprungen.
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_EDITION: cloud
        run: npx playwright test e2e/billing.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-billing-cloud
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.cloud.yml
          -f docker-compose.e2e-cloud.yml logs --no-color
      - name: Compose down
        if: always()
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.cloud.yml
          -f docker-compose.e2e-cloud.yml down -v

  changelog-guard:
    # Erzwingt das Fragment-Verfahren aus CONTRIBUTING.md (#587): ein normaler
    # PR darf `CHANGELOG.md` nicht direkt anfassen, er legt ein Fragment unter
    # `changelog.d/` an.
    #
    # BEWUSST ohne `needs: changes` und ohne `if:` — anders als die fuenf
    # schweren Jobs. Gemessener Grund: `CHANGELOG.md` passt auf die
    # Doku-Allowlist des `changes`-Jobs oben (`[A-Za-z0-9._-]+\.md$`). Ein PR,
    # der NUR den CHANGELOG anfasst — also genau der Fall, den dieses Gate
    # abweisen soll — bekommt `code=false`, und die gegateten Jobs laufen gar
    # nicht. Ein Step innerhalb von `python` oder `web` verfehlte den Zielfall
    # also strukturell und nicht nur gelegentlich.
    #
    # Die Entscheidungslogik steht in `scripts/changelog_fragments.py`
    # (Unterkommando `guard`) und nicht hier: Workflow-Shell laeuft unter
    # keinem Test, die Funktion `guard_violation` schon
    # (`scripts/tests/test_changelog_fragments.py`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Der Guard bildet die Merge-Base zwischen Basis und HEAD — dafuer
          # muss beide Historie da sein, ein flacher Checkout reicht nicht.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: CHANGELOG.md nicht direkt bearbeiten (Fragment-Verfahren)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Push auf main hat keinen PR-Kontext und damit keine Vergleichsbasis.
          # Dort ist auch nichts zu verhindern: was auf main liegt, ist bereits
          # durch dieses Gate gegangen. Sauber ueberspringen, nicht scheitern.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Kein PR-Kontext (${EVENT_NAME}) — uebersprungen."
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::error title=changelog-guard::Kein Base-SHA im PR-Kontext — \
          die Vergleichsbasis fehlt. Fail-closed statt stiller Durchlauf."
            exit 1
          fi
          # `--no-project`: das Skript braucht nur die Standardbibliothek; ein
          # `uv sync` des Workspaces waere Minuten fuer nichts.
          uv run --no-project python scripts/changelog_fragments.py guard --base "$BASE_SHA"

  audit:
    # Supply-Chain-Gate (MS-3 H6): pip-audit fuer den Python-Workspace und
    # npm audit fuer das Web-Frontend. Fail bei high/critical; moderates
    # werden im RUNBOOK akzeptiert oder direkt gefixt. Triage-Pfad:
    # deploy/hetzner/RUNBOOK.md §CVE-Response.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Export non-workspace deps
        # Editable Workspace-Members (apps/api, apps/mcp, packages/models)
        # filtern, weil pip-audit fuer sie keinen Hash aufloesen kann.
        run: uv export --format requirements-txt --no-emit-workspace --no-hashes --group billing > /tmp/who2be-reqs.txt
      - name: pip-audit (Python)
        run: uv tool run pip-audit --disable-pip --no-deps -r /tmp/who2be-reqs.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: npm audit (Web, prod-only, high+)
        working-directory: apps/web
        # `npm audit` liefert Exit 1 SOWOHL bei echten Funden ALS AUCH, wenn der
        # Audit-Dienst nicht antwortet. Ein rotes Gate sagte damit nicht, was es
        # meint — 2026-09-19 stand CI rot, weil npm den alten `audits/quick`-
        # Endpunkt abschaltete (400) und der neue `advisories/bulk` gleichzeitig
        # in Wartung war (503). Kein Fund, keine Verwundbarkeit, nur ein
        # Fremddienst. Unterschieden wird an der JSON-Form: ein echtes Ergebnis
        # traegt `.metadata.vulnerabilities`, eine Dienststoerung nur `.error`.
        #
        # Wiederholt wird NUR die Dienststoerung. Ein echter Fund faellt sofort
        # durch — ein Retry darf ein Security-Gate nie weichspuelen. Und ist der
        # Dienst dauerhaft weg, bleibt der Lauf rot: ein Gate, das gruen wird,
        # weil es nicht pruefen konnte, ist schlimmer als gar keins.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if out="$(npm audit --omit=dev --audit-level=high --json 2>audit.err)"; then
              echo "npm audit: keine Funde ab Stufe high."
              exit 0
            fi
            if printf '%s' "$out" | jq -e '.metadata.vulnerabilities' >/dev/null 2>&1; then
              echo "::error title=npm audit: Verwundbarkeiten gefunden::Siehe Job-Log."
              printf '%s' "$out" | jq '.metadata.vulnerabilities'
              printf '%s' "$out" | jq -r '
                .vulnerabilities // {} | to_entries[]
                | select(.value.severity == "high" or .value.severity == "critical")
                | "  \(.key)  \(.value.severity)"'
              exit 1
            fi
            echo "Audit-Dienst antwortet nicht (Versuch ${attempt}/3):"
            cat audit.err || true
            printf '%s' "$out" | jq -r '"  HTTP \(.statusCode // "?"): \(.error // .message // "unbekannt")"' 2>/dev/null || true
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          echo "::warning title=npm-Audit-Dienst nicht erreichbar::Nach 3 Versuchen \
          keine Antwort von der npm-Registry (siehe https://status.npmjs.org). Das ist \
          KEIN Verwundbarkeitsfund. Der Schritt blockiert nicht, weil der OSV-Scan \
          unten aus einer unabhaengigen Quelle prueft."
          exit 0
      - name: License check (Web · Deny-Liste)
        # OSS-License-Compliance (ADR-0033): fail-closed gegen Copyleft/AGPL in
        # den Produktions-Deps. Eigenes (privates) Paket ausgeschlossen; MPL-2.0
        # (BlockNote, lightningcss) bleibt erlaubt. Deny-Liste in package.json.
        working-directory: apps/web
        run: npm run license:check
      - name: OSV-Scan (Web-Lockfile, unabhaengig von der npm-Registry)
        working-directory: apps/web
        # BEWUSST als LETZTER Schritt: der License-Check davor schuettet ~1400
        # Zeilen aus und begruebe die Fundliste. Ein Diagnose-Signal gehoert
        # dorthin, wo man es liest — ans Ende des Logs.
        #
        # Zweite, UNABHAENGIGE Advisory-Quelle (Google OSV, Apache-2.0). Grund:
        # am 2026-09-19 fielen beide npm-Audit-Endpunkte gleichzeitig aus — der
        # alte `audits/quick` wurde abgeschaltet (400), der neue
        # `advisories/bulk` war in Wartung (503). Ein Supply-Chain-Gate, das an
        # genau einem Fremddienst haengt, ist waehrend dessen Ausfall blind.
        #
        # Version gepinnt, Binary gegen SHA256 geprueft. Die Summe stammt aus
        # dem offiziellen Release-Artefakt (dieses Release veroeffentlicht keine
        # checksums.txt); nachrechenbar mit:
        #   curl -sSL <url> | sha256sum
        #
        # BLOCKIEREND. Der erste CI-Lauf hat die Ausgabe gezeigt: 701 Pakete
        # gescannt, 0 Funde — scharf schalten kostet also keinen roten Lauf.
        # Bewusst STRENGER als `npm audit` daneben: voller Lockfile-Umfang
        # (inkl. dev) und jeder Schweregrad. Als zweite Meinung ist breiter
        # richtig; meldet es spaeter einmal einen dev-only Low-Fund, ist das
        # eine Information und der Umfang eine Einzeiler-Entscheidung mit
        # echten Daten statt auf Vorrat.
        env:
          OSV_VERSION: "2.2.4"
          OSV_SHA256: "7702cd1e5d9f5059dd9570f4ad967f27d3c5f5391b371ec937b384c238177f55"
        run: |
          set -uo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -sSL --retry 3 --retry-delay 5 -o /tmp/osv-scanner "$url"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c - || {
            echo "::error title=OSV-Binary: Pruefsumme stimmt nicht::Download verworfen."
            exit 1
          }
          chmod +x /tmp/osv-scanner
          echo "osv-scanner $(/tmp/osv-scanner --version 2>&1 | head -1)"
          /tmp/osv-scanner scan source --lockfile package-lock.json --format json \
            > /tmp/osv.json 2>/tmp/osv.err
          scan_rc=$?
          echo "--- osv-scanner stderr ---"; cat /tmp/osv.err || true

          # Findet der Scanner nichts, ist rc=0 und das JSON leer/knapp; findet er
          # etwas, ist rc=1. BEIDES ist ein Ergebnis. Alles andere heisst: das
          # Werkzeug selbst ist nicht gelaufen — und ein Schritt, der das
          # verschweigt und gruen bleibt, waere wertlos. Genau diese Sorte
          # bedeutungsloses Gruen hat heute schon zwei Fehlersuchen gekostet.
          if ! jq -e 'has("results")' /tmp/osv.json >/dev/null 2>&1; then
            echo "::error title=OSV-Scan nicht gelaufen::osv-scanner lieferte kein \
            verwertbares JSON (rc=${scan_rc}). Das ist KEIN Befund, sondern ein \
            kaputter Scan — stderr steht im Log."
            exit 1
          fi

          count=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' /tmp/osv.json)
          list=$(jq -r '.results[]?.packages[]? | select(.vulnerabilities)
                        | "  \(.package.name)@\(.package.version)  " +
                          ([.vulnerabilities[].id] | join(", "))' /tmp/osv.json)
          echo "OSV: ${count} Eintraege (rc=${scan_rc})"
          [ -n "$list" ] && printf '%s\n' "$list"
          {
            echo "## OSV-Scan"
            echo
            echo "Gefundene Eintraege: **${count}**"
            [ -n "$list" ] && { echo; echo '```'; printf '%s\n' "$list" | head -50; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error title=OSV: Verwundbarkeiten gefunden::${count} Eintraege — \
            Liste im Job-Log und in der Step-Summary."
            exit 1
          fi

  all-green:
    # Aggregat-Job (P3). Er ist dazu bestimmt, der EINZIGE Required Check auf
    # `main` zu werden — die Einzeljobs duerfen es nicht sein: fuenf von ihnen
    # haengen an der Doku-Allowlist des `changes`-Jobs und melden bei einem
    # Doku-PR "skipped", was GitHub bei Required Checks wie Erfolg wertet;
    # umgekehrt bliebe ein Required Check, der gar nicht erst startet, dauerhaft
    # auf "Waiting for status to be reported" stehen und der PR nie mergebar.
    # Ein einziger, immer laufender Job hat beide Probleme nicht.
    #
    # Der Job-NAME ist Teil der Repo-Konfiguration: Required Checks binden per
    # exakter Namensgleichheit. `name:` ist deshalb bewusst identisch zur Job-Id
    # gesetzt (sonst zeigt die Checks-Liste die Id, hier waere das zufaellig
    # dasselbe — explizit ist es nachlesbar). Ein Rename bricht jeden offenen
    # PR und muss zusammen mit dem Ruleset passieren, nie allein.
    #
    # `if: always()` ist nicht optional: ohne ihn setzt GitHub diesen Job auf
    # "skipped", sobald irgendein Vorgaenger fehlschlaegt — und skipped gilt an
    # genau den Stellen als Erfolg, an denen es hier darauf ankommt. Der Job
    # muss laufen und selbst urteilen.
    name: all-green
    if: always()
    # Bewusst ALLE Jobs, `changes` eingeschlossen. Ohne ihn waere der wichtigste
    # Fehlerfall unsichtbar — siehe Begruendung im Auswertungs-Step.
    needs:
      - changes
      - python
      - web
      - compose-smoke
      - e2e
      - e2e-billing-cloud
      - audit
      - changelog-guard
    runs-on: ubuntu-latest
    steps:
      - name: Jeden Vorgaenger gegen sein ERWARTETES Ergebnis pruefen
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          COMPOSE_SMOKE_RESULT: ${{ needs['compose-smoke'].result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_BILLING_CLOUD_RESULT: ${{ needs['e2e-billing-cloud'].result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          CHANGELOG_GUARD_RESULT: ${{ needs['changelog-guard'].result }}
        run: |
          set -uo pipefail
          # Warum nicht einfach "kein Vorgaenger ist rot"?
          #
          # Weil `skipped` in diesem Workflow ZWEI gegensaetzliche Dinge heisst
          # und beide in `needs.*.result` identisch aussehen:
          #
          #   (1) LEGITIM: der `changes`-Job hat den Diff als reine Doku
          #       klassifiziert (code=false) und die fuenf schweren Jobs
          #       bewusst uebersprungen. Das ist der haeufigste PR-Typ hier und
          #       muss gruen durchgehen.
          #   (2) GEFAEHRLICH: der `changes`-Job selbst ist rot oder abgebrochen.
          #       Dann werden dieselben fuenf Jobs ebenfalls uebersprungen —
          #       nicht weil sie ueberfluessig waren, sondern weil das Tor
          #       kaputt ist. Eine Pruefung, die `skipped` pauschal durchwinkt,
          #       meldet hier GRUEN, obwohl nichts geprueft wurde.
          #
          # Unterscheidbar sind die Faelle nur ueber den `changes`-Job selbst.
          # Deshalb wird nicht gegen eine Liste ERLAUBTER Ergebnisse geprueft,
          # sondern gegen das je Lage ERWARTETE: eine Erlaubnisliste waechst
          # still mit jedem neuen Conclusion-Wert, eine Erwartung nicht.
          # `failure` und `cancelled` fallen dadurch ueberall durch, ohne eigens
          # aufgezaehlt zu sein.
          rc=0
          fail() { echo "::error title=all-green::$1"; rc=1; }

          expect() { # $1=Jobname $2=Ist $3=Soll
            if [ "$2" = "$3" ]; then
              echo "  OK       ${1}: ${2} (erwartet: ${3})"
            else
              fail "${1}: '${2}', erwartet '${3}'."
            fi
          }

          echo "changes=${CHANGES_RESULT} code=${CODE:-<leer>}"

          # Das Tor zuerst — ohne verlaessliches `changes` ist jede Aussage
          # ueber die gegateten Jobs wertlos, also gar nicht erst treffen.
          if [ "$CHANGES_RESULT" != "success" ]; then
            fail "Der Gate-Job 'changes' ist '${CHANGES_RESULT}'. Die davon \
          abhaengigen Jobs sind damit uebersprungen, OHNE dass der Diff \
          klassifiziert wurde — das ist kein Doku-PR, sondern ein kaputtes Tor."
            exit 1
          fi

          # Erwartung fuer die fuenf gegateten Jobs aus der Klassifikation
          # ableiten. Unbekannter Wert: fail-closed, also vollen Lauf verlangen.
          case "${CODE:-}" in
            true)  gated_expected=success ;;
            false) gated_expected=skipped ;;
            *)
              fail "Unerwarteter Wert fuer changes.outputs.code: '${CODE:-<leer>}'. \
          Es wird fail-closed ein vollstaendiger Lauf verlangt."
              gated_expected=success
              ;;
          esac
          echo "Erwartung fuer die gegateten Jobs: ${gated_expected}"

          expect python            "$PYTHON_RESULT"            "$gated_expected"
          expect web               "$WEB_RESULT"               "$gated_expected"
          expect compose-smoke     "$COMPOSE_SMOKE_RESULT"     "$gated_expected"
          expect e2e               "$E2E_RESULT"               "$gated_expected"
          expect e2e-billing-cloud "$E2E_BILLING_CLOUD_RESULT" "$gated_expected"

          # `audit` haengt bewusst an keinem Pfadfilter (fragt eine Live-CVE-
          # Datenbank ab) und muss deshalb immer wirklich gelaufen sein.
          expect audit "$AUDIT_RESULT" success

          # `changelog-guard` ebenso: er haengt an keinem Gate, weil ein reiner
          # CHANGELOG-PR vom `changes`-Job als Doku eingestuft wird — genau der
          # Fall, den er abweisen soll. Er muss also immer gelaufen sein.
          expect changelog-guard "$CHANGELOG_GUARD_RESULT" success

          if [ "$rc" -ne 0 ]; then
            echo "all-green: FEHLGESCHLAGEN."
            exit 1
          fi
          echo "all-green: alle Vorgaenger wie erwartet."

