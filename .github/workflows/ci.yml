name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: who2be
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync dependencies
        # `--group billing` installiert das optionale Cloud-Billing-Paket, damit
        # dessen Tests + Typecheck laufen. Die Build-Zeit-Isolation (kein Mollie
        # im On-Prem-Artefakt) wird im Docker-Build erzwungen, nicht hier.
        run: uv sync --group billing
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy .
      - name: Test (coverage ratchet + DB-Skip-Guard)
        # WHO2BE_REQUIRE_DB=1: ohne erreichbare DB bricht die Suite hart ab
        # (conftest.py, ADR-0032) — kein stilles "gruen durch Skip" mehr.
        # --cov-fail-under: Ratchet-Floor. CI-gemessen (722 Tests inkl. DB):
        # 86.92 % -> Floor 85 (2 Pkt Headroom). Anhebung nur in Coverage-PRs.
        env:
          WHO2BE_REQUIRE_DB: "1"
        run: >-
          uv run pytest -q --cov --cov-report=term-missing
          --cov-report=xml --cov-fail-under=85
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Test (coverage ratchet)
        # `test:coverage` faehrt die volle Vitest-Suite mit v8-Coverage und
        # erzwingt die Thresholds aus vite.config.ts (Floor, ADR-0032).
        run: npm run test:coverage
      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: ignore
      - name: A11y (axe via vitest)
        # Eigenes Gate: A11y-Tests laufen bereits unter `npm test` mit, hier
        # gefiltert (`testNamePattern a11y`) als sichtbarer Step. Bricht den
        # Build sofort, wenn axe Violations meldet — keine Regress-Lecks.
        run: npm run test:a11y
      - name: Build
        run: npm run build
      - name: Assert on-prem bundle excludes Billing-UI (ADR-0029)
        # Default-Build = On-Prem (kein VITE_WHO2BE_EDITION) → features/billing
        # muss aus dem Bundle tree-geshaked sein. Marker: BillingPanel-CTA.
        run: |
          if grep -rlE "Jetzt upgraden|Monatsverbrauch" dist; then
            echo "::error::Billing-UI ist ins On-Prem-Bundle gelangt"; exit 1
          fi
          echo "OK: Billing-UI nicht im On-Prem-Bundle."

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compose env
        run: cp .env.example .env
      - name: Compose up (build + wait healthy)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke
        run: bash scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Compose down
        if: always()
        run: docker compose down -v

  e2e:
    # Duenne E2E-Spitze (ADR-0032, Phase 4): Playwright gegen den echten
    # Compose-Stack (Web :5173, API :8000). Soft-Gate (`continue-on-error`)
    # waehrend der Stabilisierung — bricht den Build noch nicht; nach 1–2
    # gruenen Laeufen wird `continue-on-error` entfernt (hartes Gate).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Compose env
        run: cp .env.example .env
      - name: Compose up (build + wait healthy)
        run: docker compose up -d --build --wait --wait-timeout 240
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: npm run e2e:install
      - name: Run E2E
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Compose down
        if: always()
        run: docker compose down -v

  audit:
    # Supply-Chain-Gate (MS-3 H6): pip-audit fuer den Python-Workspace und
    # npm audit fuer das Web-Frontend. Fail bei high/critical; moderates
    # werden im RUNBOOK akzeptiert oder direkt gefixt. Triage-Pfad:
    # deploy/hetzner/RUNBOOK.md §CVE-Response.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Export non-workspace deps
        # Editable Workspace-Members (apps/api, apps/mcp, packages/models)
        # filtern, weil pip-audit fuer sie keinen Hash aufloesen kann.
        run: uv export --format requirements-txt --no-emit-workspace --no-hashes --group billing > /tmp/who2be-reqs.txt
      - name: pip-audit (Python)
        run: uv tool run pip-audit --disable-pip --no-deps -r /tmp/who2be-reqs.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: npm audit (Web, prod-only, high+)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
