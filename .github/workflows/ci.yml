name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: who2be
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        # `--group billing` installiert das optionale Cloud-Billing-Paket, damit
        # dessen Tests + Typecheck laufen. Die Build-Zeit-Isolation (kein Mollie
        # im On-Prem-Artefakt) wird im Docker-Build erzwungen, nicht hier.
        run: uv sync --group billing
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy .
      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -b
      - name: Test
        run: npm test
      - name: A11y (axe via vitest)
        # Eigenes Gate: A11y-Tests laufen bereits unter `npm test` mit, hier
        # gefiltert (`testNamePattern a11y`) als sichtbarer Step. Bricht den
        # Build sofort, wenn axe Violations meldet — keine Regress-Lecks.
        run: npm run test:a11y
      - name: Build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose env
        run: cp .env.example .env
      - name: Compose up (build + wait healthy)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke
        run: bash scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Compose down
        if: always()
        run: docker compose down -v

  audit:
    # Supply-Chain-Gate (MS-3 H6): pip-audit fuer den Python-Workspace und
    # npm audit fuer das Web-Frontend. Fail bei high/critical; moderates
    # werden im RUNBOOK akzeptiert oder direkt gefixt. Triage-Pfad:
    # deploy/hetzner/RUNBOOK.md §CVE-Response.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Export non-workspace deps
        # Editable Workspace-Members (apps/api, apps/mcp, packages/models)
        # filtern, weil pip-audit fuer sie keinen Hash aufloesen kann.
        run: uv export --format requirements-txt --no-emit-workspace --no-hashes --group billing > /tmp/who2be-reqs.txt
      - name: pip-audit (Python)
        run: uv tool run pip-audit --disable-pip --no-deps -r /tmp/who2be-reqs.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: npm audit (Web, prod-only, high+)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
