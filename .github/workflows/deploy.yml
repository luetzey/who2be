name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # On-Prem-API (Default-Target `runtime`, OHNE Billing) — bleibt
          # unangetastet unter `who2be-api`.
          - image: api
            dockerfile: apps/api/Dockerfile
            target: ""
            build_args: ""
          # OHNE VITE_*-Build-Args: die URLs waeren sonst Compile-Time im
          # Bundle einbetoniert und das Image nur fuer genau eine Domain
          # brauchbar. Die App liest sie zur Laufzeit aus /config.js (Env am
          # Container, siehe apps/web/docker/40-who2be-runtime-config.sh) und
          # faellt sonst auf Same-Origin zurueck. Dasselbe Image laeuft damit
          # in Prod, lokal auf localhost und ueber eine LAN-IP.
          - image: web
            dockerfile: apps/web/Dockerfile
            target: ""
            build_args: ""
          - image: mcp
            dockerfile: apps/mcp/Dockerfile
            target: ""
            build_args: ""
          # Cloud-API (Target `runtime-cloud`, MIT who2be-billing) — eigenes
          # Tag `who2be-api-cloud`, damit das On-Prem-Image unberuehrt bleibt.
          - image: api-cloud
            dockerfile: apps/api/Dockerfile
            target: runtime-cloud
            build_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/luetzey/who2be-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            # prefix= ueberschreibt den Default `sha-`, damit das Tag dem
            # bare Commit-SHA entspricht, das deploy.sh in *_IMAGE_TAG setzt.
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          target: ${{ matrix.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: ${{ matrix.build_args }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Ueberspringt sauber, solange der Operator den Host noch nicht
    # konfiguriert hat (C1 nicht fertig). Build-and-Push laeuft trotzdem.
    if: vars.DEPLOY_HOST != ''
    steps:
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run deploy.sh on host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PROJECT_DIR: ${{ vars.DEPLOY_PROJECT_DIR || '/opt/who2be' }}
          DEPLOY_SHA: ${{ github.sha }}
          # Edition-Schalter: `cloud` faehrt das Cloud-Overlay (zwei -f-Files,
          # runtime-cloud-API). Leer/unset ⇒ On-Prem-Default.
          WHO2BE_EDITION: ${{ vars.WHO2BE_EDITION || 'onprem' }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "PROJECT_DIR='${DEPLOY_PROJECT_DIR}' WHO2BE_EDITION='${WHO2BE_EDITION}' ${DEPLOY_PROJECT_DIR}/deploy/hetzner/scripts/deploy.sh '${DEPLOY_SHA}'"
