name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Debounce-Fenster fuer push-getriggerte Deploys, in Sekunden.
  # Bewusst als sichtbare Konstante im Workflow statt als Repo-Variable:
  # `vars.DEPLOY_HOST` hat real Stunden gekostet, WEIL sein Zustand im Repo
  # nicht sichtbar war (siehe `deploy-not-configured` unten). Ein Wert, den
  # man nur im Settings-UI sieht, ist ein Wert, den beim Debuggen niemand
  # nachschlaegt.
  # 600 s = 10 min. Die Breite ist eine LATENZ-Entscheidung, keine
  # Buendelungs-Grenze: ein breiteres Fenster buendelt durchaus mehr.
  # Gemessen ueber die letzten 100 push-Laeufe (2026-08-22 … 2026-09-24,
  # `gh run list --workflow=deploy.yml --limit 100`, Abstaende zwischen
  # aufeinanderfolgenden Laeufen):
  #   Fenster  600 s (10 min) → 59 Deploys
  #   Fenster 1800 s (30 min) → 49 Deploys
  # 30 min sparen also ueber einen Monat 10 weitere Deploys (~17 %), kosten
  # aber auf JEDEM Merge bis zu 30 statt 10 min bis Live. Zehn Luecken liegen
  # im Bereich (600 s, 1800 s], die groesste 1592 s = 26,5 min
  # (33986784452 → 33988114659). Die dichten Serien, um die es in der
  # Owner-Entscheidung ging, faengt schon das 10-min-Fenster vollstaendig:
  # innerhalb der vier Serien vom 2026-09-23/24 war der groesste Abstand
  # 3 min 47 s (35956582714 → 35956848991). Der Rest waere Latenz fuer einen
  # Grenznutzen — deshalb 10. Wer 30 will, aendert diese eine Zahl.
  DEPLOY_DEBOUNCE_SECONDS: "600"

jobs:
  # Buendelt eine Merge-Serie zu EINEM Deploy. Vorher loeste jeder Push auf
  # `main` einen eigenen Lauf aus: am 2026-09-23 um 20:05 Uhr waren das NEUN
  # Laeufe in 36 Sekunden (35913613271 … 35913678893), jeder mit vier
  # Image-Builds und einem Service-Neustart. Acht davon waren wertlos, weil nur
  # der letzte Stand zaehlt.
  #
  # Mechanismus: ein Wartefenster, geschuetzt von einer concurrency-Gruppe mit
  # `cancel-in-progress: true` — ein Debounce. Jeder weitere Push cancelt den
  # wartenden Lauf und startet sein eigenes Fenster; nach dem letzten Merge
  # einer Serie ueberlebt genau einer und deployt den neuesten Stand.
  #
  # Kosten: keine. Das Repo ist public und faehrt Standard-Runner, und fuer die
  # ist die Actions-Nutzung laut GitHub-Billing-Doku frei ("GitHub Actions usage
  # is free … for public repositories that use standard GitHub-hosted runners").
  # Ein wartender Job verbrennt hier also kein Minuten-Kontingent — er belegt
  # nur einen von 20 Job-Slots, und es wartet zu jedem Zeitpunkt genau einer.
  #
  # Die Gruppe traegt den Event-Namen: ein manueller `workflow_dispatch` cancelt
  # damit keinen wartenden Push-Lauf und wird von keinem gecancelt. Er wartet
  # ausserdem gar nicht erst (siehe `if:` am Sleep-Step) — der manuelle Weg
  # bleibt der sofortige.
  debounce:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-debounce-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Merge-Serie sammeln
        if: github.event_name == 'push'
        run: |
          echo "Warte ${DEPLOY_DEBOUNCE_SECONDS}s. Jeder weitere Push auf \
          ${GITHUB_REF_NAME} bricht diesen Lauf ab und startet sein eigenes \
          Fenster — deployt wird der letzte."
          sleep "${DEPLOY_DEBOUNCE_SECONDS}"

      # Diagnose, KEIN Abbruch. Die naheliegende Variante waere, hier hart
      # abzubrechen, wenn der eigene SHA nicht mehr HEAD ist. Das waere ein
      # Fehler: der Abbruch setzt voraus, dass fuer den neuen HEAD garantiert
      # ein Deploy-Lauf existiert — ein Commit mit `[skip ci]` in der Nachricht
      # startet aber keinen. Der wartende Lauf braeche ab, der neue triggerte
      # nie einen, und dieser Stand bliebe DAUERHAFT unausgeliefert.
      # Deshalb: im Zweifel einmal zu viel deployen (harmlos, der serialisierte
      # Nachfolgelauf korrigiert unmittelbar) statt einen Stand liegen zu lassen
      # (nicht harmlos).
      - name: Stand pruefen (nur Bericht)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" \
            --jq .sha 2>/dev/null || echo unknown)"
          if [ "${head}" = "${GITHUB_SHA}" ]; then
            echo "Eigener SHA ist HEAD von ${GITHUB_REF_NAME}." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Stand hat sich bewegt::HEAD ist ${head}, \
            dieser Lauf traegt ${GITHUB_SHA}. Es wird trotzdem deployt; der \
            Folgelauf liefert ${head} unmittelbar danach nach."
            {
              echo "## Stand hat sich waehrend des Fensters bewegt"
              echo
              echo "- Lauf-SHA: \`${GITHUB_SHA}\`"
              echo "- HEAD: \`${head}\`"
              echo
              echo "Es wird bewusst trotzdem deployt — siehe Kommentar am"
              echo "\`debounce\`-Job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-push:
    needs: debounce
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # On-Prem-API (Default-Target `runtime`, OHNE Billing) — bleibt
          # unangetastet unter `who2be-api`.
          - image: api
            dockerfile: apps/api/Dockerfile
            target: ""
            build_args: ""
          # OHNE VITE_*-Build-Args: die URLs waeren sonst Compile-Time im
          # Bundle einbetoniert und das Image nur fuer genau eine Domain
          # brauchbar. Die App liest sie zur Laufzeit aus /config.js (Env am
          # Container, siehe apps/web/docker/40-who2be-runtime-config.sh) und
          # faellt sonst auf Same-Origin zurueck. Dasselbe Image laeuft damit
          # in Prod, lokal auf localhost und ueber eine LAN-IP.
          - image: web
            dockerfile: apps/web/Dockerfile
            target: ""
            build_args: ""
          - image: mcp
            dockerfile: apps/mcp/Dockerfile
            target: ""
            build_args: ""
          # Cloud-API (Target `runtime-cloud`, MIT who2be-billing) — eigenes
          # Tag `who2be-api-cloud`, damit das On-Prem-Image unberuehrt bleibt.
          - image: api-cloud
            dockerfile: apps/api/Dockerfile
            target: runtime-cloud
            build_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/luetzey/who2be-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            # prefix= ueberschreibt den Default `sha-`, damit das Tag dem
            # bare Commit-SHA entspricht, das deploy.sh in *_IMAGE_TAG setzt.
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          target: ${{ matrix.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: ${{ matrix.build_args }}

  # Der `deploy`-Job unten haengt an `vars.DEPLOY_HOST`. Fehlt die Variable,
  # wird er uebersprungen — und ein uebersprungener Job macht den Run NICHT rot.
  # Der Lauf hiess dann "Deploy" und war gruen, ohne dass je etwas auf der Box
  # ankam. Das hat real Stunden gekostet: ein gemergter, "deployter" Fix wirkte
  # nicht, und die Suche ging in den Anwendungscode statt in die Pipeline.
  # Dieser Job macht den Zustand sichtbar, statt ihn zu verschweigen. Er soll
  # NICHT fehlschlagen — auf einem Repo ohne Host ist "nicht deployen" korrekt;
  # falsch war nur, es stillschweigend zu tun.
  deploy-not-configured:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.DEPLOY_HOST == ''
    steps:
      - name: Kein Deploy ausgefuehrt (DEPLOY_HOST fehlt)
        run: |
          echo "::warning title=KEIN DEPLOY::Images liegen auf GHCR, aber es \
          wurde NICHT deployed: die Repo-Variable DEPLOY_HOST ist nicht gesetzt."
          {
            echo "## Kein Deploy ausgefuehrt"
            echo
            echo "Die Images zu \`${GITHUB_SHA}\` sind gebaut und liegen auf GHCR."
            echo "Auf einen Host gebracht wurde **nichts** — \`vars.DEPLOY_HOST\`"
            echo "ist leer, deshalb wurde der \`deploy\`-Job uebersprungen."
            echo
            echo "**Dieser gruene Lauf bedeutet nicht, dass die Aenderung live ist.**"
            echo
            echo "Damit automatisch deployed wird: Repo-Variablen \`DEPLOY_HOST\`"
            echo "und \`DEPLOY_USER\` setzen, dazu das Secret \`DEPLOY_SSH_KEY\`."
            echo "Bis dahin laeuft der Deploy von Hand — siehe RUNBOOK."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Laeuft NUR mit konfiguriertem Host. Der Gegenpart `deploy-not-configured`
    # oben meldet den anderen Fall sichtbar — nie wieder stumm.
    # Zusaetzlich an `main` gebunden: `workflow_dispatch` laesst sich auf jedem
    # Ref ausloesen, und ein Produktiv-Deploy von einem Testbranch waere eine
    # offene Flanke. Der Build oben bleibt ref-unabhaengig (ein manueller Build
    # eines Branches ist harmlos und nuetzlich).
    if: vars.DEPLOY_HOST != '' && github.ref == 'refs/heads/main'
    # Deploys serialisieren, NIEMALS abbrechen. `cancel-in-progress: false` ist
    # hier die eigentliche Aussage: ein laufender Deploy steckt mitten in
    # `docker compose up -d` auf der Produktivbox — den abzuschiessen hiesse,
    # den Stack halb hochgefahren zurueckzulassen. Kommt waehrenddessen ein
    # Merge, wird sein Lauf `pending` ("the queued job or workflow will be
    # pending", Workflow-Syntax-Doku) und faehrt danach. Beide Staende werden
    # ausgeliefert, in Reihenfolge — es bleibt keiner liegen.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run deploy.sh on host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PROJECT_DIR: ${{ vars.DEPLOY_PROJECT_DIR || '/opt/who2be' }}
          DEPLOY_SHA: ${{ github.sha }}
          # Edition-Schalter: `cloud` faehrt das Cloud-Overlay (zwei -f-Files,
          # runtime-cloud-API). Leer/unset ⇒ On-Prem-Default.
          WHO2BE_EDITION: ${{ vars.WHO2BE_EDITION || 'onprem' }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "PROJECT_DIR='${DEPLOY_PROJECT_DIR}' WHO2BE_EDITION='${WHO2BE_EDITION}' ${DEPLOY_PROJECT_DIR}/deploy/hetzner/scripts/deploy.sh '${DEPLOY_SHA}'"
