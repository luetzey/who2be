# Dependabot — proaktive Supply-Chain-Patches (WP-G, Befund S5).
#
# Ergaenzt den reaktiven CI-`audit`-Job (.github/workflows/ci.yml, pip-audit +
# npm audit) — ersetzt ihn NICHT: audit ist das Gate (failt bei High/Critical),
# Dependabot ist der Patch-Lieferant (oeffnet PRs, bevor ein CVE auflaeuft).
#
# Wochentakt + Gruppierung halten das PR-Volumen niedrig: minor/patch-Updates
# eines Ecosystems landen in EINEM PR; Major-Bumps kommen einzeln (Review noetig).
# Labels sind Best-Effort — fehlende Custom-Labels ueberspringt Dependabot mit
# Warnung im Log (kein harter Fehler). Re-Use: dieselbe Triage wie im RUNBOOK
# §CVE-Response.
version: 2

updates:
  # --- Python (uv-Workspace im Repo-Root, uv.lock) -------------------------
  # Editable Workspace-Members (apps/api, apps/mcp, packages/*) bleiben lokal;
  # Dependabot bumpt die externen Abhaengigkeiten ueber uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Web-Frontend (npm, apps/web) ----------------------------------------
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(web)"
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # Gekoppelte Tooling-Majors buendeln, statt sie einzeln rot auflaufen zu
      # lassen: einzeln gebumpt scheitern sie an `npm ci` (ERESOLVE) bzw. an
      # Peer-Bruechen. Als Gruppe kommen die zusammengehoerigen Pakete in EINEM
      # PR und sind als Set installier-/review-bar (vgl. CI-Triage 2026-06-05).
      web-lint-tooling-major:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - "major"
      web-vite-major:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
    ignore:
      # Framework-Majors sind bewusste, koordinierte Migrationen — kein
      # Bot-Auto-Bump. React 18->19 ist ein eigenes Projekt (Test-Pyramide
      # ADR-0041 als Sicherheitsnetz); Mantine 9 setzt React 19 voraus
      # (`useEffectEvent`), darf also nicht vor dem React-Sprung kommen.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mantine/hooks"
        update-types: ["version-update:semver-major"]

  # --- GitHub-Actions (Workflows in .github/workflows) ---------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        update-types:
          - "minor"
          - "patch"

  # --- Compose-Images (Betriebs-Stacks) ------------------------------------
  # `docker` oben erfasst ausschliesslich Dockerfiles. Die Images, die den
  # Betrieb tragen — Caddy, Postgres, GoTrue, nginx, Redis, SeaweedFS — stehen
  # aber nicht in einem Dockerfile, sondern als `image:`-Pin in Compose-Dateien.
  # Ohne dieses Ecosystem laufen deren Updates durch kein Verfahren; der
  # CI-`audit`-Job prueft Python- und npm-Pakete, nicht Container-Tags.
  #
  # Vollstaendigkeit ist hier der ganze Punkt: eine Teilabdeckung waere
  # schlechter als keine, weil die nicht erfassten Dateien dann als geprueft
  # gelten. Erfasst sind daher ALLE vier Verzeichnisse, in denen Compose-Dateien
  # externe Images pinnen:
  #   /                          docker-compose.yml, docker-compose.cloud.yml
  #   /deploy/dokploy            docker-compose.yml, docker-compose.cloud.yml
  #   /deploy/hetzner/supabase   docker-compose.yml
  #   /deploy/hetzner/who2be     docker-compose.yml, .cloud.yml, .local.yml
  # Gegen stilles Auseinanderlaufen gesichert: der Test
  # `apps/api/tests/test_dependabot_compose_coverage.py` zaehlt die Compose-
  # Dateien des Repos ab und failt, sobald eine in einem hier nicht genannten
  # Verzeichnis auftaucht. Eine neue Datei darf nicht unbemerkt durchfallen.
  #
  # Nicht erfasst bleiben `docker-compose.images.yml` und
  # `docker-compose.e2e-cloud.yml` im Root: beide pinnen kein externes Image
  # (nur eigene ghcr.io-Tags bzw. gar keins) — sie liegen aber im ohnehin
  # erfassten Root-Verzeichnis, es entsteht also keine Luecke.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/deploy/dokploy"
      - "/deploy/hetzner/supabase"
      - "/deploy/hetzner/who2be"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(compose)"
    groups:
      compose-images:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major-Bumps der Datenhalter sind Migrationen, keine Bot-Arbeit: ein
      # Postgres-Major verlangt `pg_upgrade` bzw. Dump/Restore, ein
      # GoTrue-Major faehrt Auth-Migrationen im Startvorgang (RUNBOOK
      # §GoTrue-Version anheben). Als Auto-PR waeren sie ein stiller
      # Datenverlust-Pfad; minor/patch kommen weiter gruppiert.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pgvector/pgvector"
        update-types: ["version-update:semver-major"]
      - dependency-name: "supabase/postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "supabase/gotrue"
        update-types: ["version-update:semver-major"]

  # --- Container-Base-Images (alle Dockerfiles) ----------------------------
  # `directories` (plural) buendelt alle vier Dockerfile-Pfade in EINE
  # Ecosystem-Konfiguration; Base-Image-Bumps (postgres, gotrue, caddy, …)
  # kommen so gruppiert pro Woche.
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/apps/mcp"
      - "/deploy/hetzner/backup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-images:
        update-types:
          - "minor"
          - "patch"
