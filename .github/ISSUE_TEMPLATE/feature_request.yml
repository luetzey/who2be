name: Feature request
description: Suggest an improvement or new capability for Who2Be
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Check
        [ROADMAP.md](https://github.com/luetzey/who2be/blob/main/ROADMAP.md)
        first — your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - REST API (apps/api)
        - MCP server (apps/mcp)
        - Web UI (apps/web)
        - Deployment / infra
        - Documentation
        - Other / unsure
    validations:
      required: false
