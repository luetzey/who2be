name: Bug report
description: Report a reproducible problem in Who2Be
title: "fix: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please do **not** report
        security vulnerabilities here — use the process in
        [SECURITY.md](https://github.com/luetzey/who2be/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Who2Be is affected?
      options:
        - REST API (apps/api)
        - MCP server (apps/mcp)
        - Web UI (apps/web)
        - Shared models (packages/models)
        - Billing (packages/billing)
        - Deployment / infra (deploy, docker-compose)
        - Documentation
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release version or commit SHA you are running.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Please redact secrets, tokens, and personal data.
      render: shell
    validations:
      required: false
