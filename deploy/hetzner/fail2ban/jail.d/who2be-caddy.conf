# fail2ban-Jails: Rate-Limit an der Kante fuer den Hetzner-Stack (#540, Option A).
#
# VORLAGE. Auf dem Host nach /etc/fail2ban/jail.d/who2be-caddy.conf kopieren,
# den Filter nach /etc/fail2ban/filter.d/who2be-caddy.conf. Einrichtung,
# Pruefung, Entsperren und Abschalten: deploy/hetzner/RUNBOOK.md
# §Rate-Limit an der Kante (fail2ban).
#
# `.conf` statt des fail2ban-ueblichen `.local`: `*.local` steht in der
# .gitignore dieses Repos, die Vorlage waere sonst nie im Repo gelandet. In
# jail.d/ liest fail2ban beide Endungen gleich.
#
# Die Schwellen stehen NUR hier. Aendern heisst: Datei auf dem Host anpassen,
# `fail2ban-client reload <jail>` — kein Image, kein Deploy.
#
# ---------------------------------------------------------------------------
# logpath — der EINE Wert, der auf dem Host angepasst werden muss.
#
# Caddy schreibt nach /var/log/caddy/access.log IM Container; die Datei liegt
# im benannten Volume `caddy-logs` (deploy/hetzner/who2be/docker-compose.yml).
# fail2ban laeuft auf dem Host und liest den Volume-Pfad direkt. Der Name des
# Volumes traegt den Compose-Projektnamen als Praefix — bei `deploy.sh`
# (Compose-Datei in deploy/hetzner/who2be/, kein `-p`) ist das `who2be`.
# Den tatsaechlichen Pfad liefert, statt ihn zu raten:
#
#   docker volume inspect -f '{{ .Mountpoint }}' who2be_caddy-logs
#
# NICHT `access*.log*` als Glob: rotierte Generationen sind gzip und alt —
# fail2ban wuerde sie beim Start auswerten und laengst vergangene Anfragen
# erneut zaehlen.
# ---------------------------------------------------------------------------
#
# Warum `chain = DOCKER-USER`: Caddys Ports 80/443 sind von Docker
# veroeffentlicht. Docker leitet diese Pakete per DNAT um, BEVOR die
# INPUT-Kette greift, in die fail2ban per Default sperrt — eine Sperre dort
# waere wirkungslos (dieselbe Mechanik wie bei ufw, RUNBOOK §4 Firewall).
# DOCKER-USER ist die Kette, die Docker ausdruecklich fuer eigene Regeln vor
# seinen eigenen auswertet. Gesperrt wird `allports`: die IP erreicht danach
# keinen Container mehr; SSH (Host, INPUT) bleibt davon unberuehrt.
#
# Warum ignoreip die Docker-Netze enthaelt: Docker-Bridge-Netze und Loopback
# werden nie gesperrt, eine Sperre traefe sonst alle Clients hinter dem
# Gateway auf einmal. 172.16.0.0/12 ist Dockers Default-Adressraum. Ob Caddy
# echte Client-Adressen protokolliert, prueft RUNBOOK §Pruefen.

[DEFAULT]
# Gemeinsam fuer beide Jails.
logpath   = /var/lib/docker/volumes/who2be_caddy-logs/_data/access.log
backend   = polling
banaction = iptables-allports
chain     = DOCKER-USER
ignoreip  = 127.0.0.1/8 ::1 172.16.0.0/12

# auth — Anmelde- und Token-Routen (GoTrue unter supabase.<DOMAIN>, OAuth unter
# api.<DOMAIN>). 10 Fehlversuche in 10 Minuten: ein Mensch, der sein Passwort
# vergessen hat, kommt nicht hin, ein Rater nach einer Minute. Ein
# MCP-Connector erneuert sein Token etwa stuendlich und bleibt weit darunter.
[who2be-caddy-auth]
enabled  = true
filter   = who2be-caddy[mode=auth]
maxretry = 10
findtime = 10m
bantime  = 1h

# edge — Haeufung von 401/403/429 auf der ganzen API. 120 in 2 Minuten ist
# eine Flut: das App-Limit fuer Schreibzugriffe liegt bei 30/min, ein Client
# kommt also nur hierher, wenn er die 429-Antworten der App ignoriert und
# weiterfeuert. Kurze Sperre, weil hier eher ein fehlgeleiteter Client als ein
# Angreifer haengen bleibt. mcp.<DOMAIN> und /v1/health zaehlen nie (Filter).
[who2be-caddy-edge]
enabled  = true
filter   = who2be-caddy[mode=edge]
maxretry = 120
findtime = 2m
bantime  = 15m
