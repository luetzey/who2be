# fail2ban-Filter: Rate-Limit an der Kante fuer den Hetzner-Stack (#540, Option A).
#
# Liest Caddys JSON-Access-Log (deploy/hetzner/Caddyfile, Snippet `access_log`)
# und meldet je Zeile die Quell-IP, wenn eine Anfrage an einer der unten
# genannten Stellen abgewiesen wurde. Gesperrt wird erst, wenn eine IP im
# Zeitfenster der Jail (`findtime`) ueber `maxretry` kommt — die Schwellen
# stehen in ../jail.d/who2be-caddy.local, nicht hier.
#
# Zwei Modi, je eine Jail:
#
#   auth  Anmelde- und Token-Routen, also das, was ein Passwort- oder
#         Token-Rater trifft:
#           supabase.<DOMAIN>/auth/v1/{token,signup,recover,otp,magiclink,verify,resend}
#             mit 400/401/403/422/429. GoTrue meldet ein falsches Passwort als
#             400 (`invalid_grant`), nicht als 401 — ohne 400 saehe der
#             Filter den haeufigsten Fehlversuch gar nicht.
#           api.<DOMAIN>/oauth/{token,register,authorize} mit 400/401/403/429
#             (ADR-0036, OAuth-Endpunkte fuer MCP-Connectoren).
#   edge  Haeufung von 401/403/429 auf der gesamten API (`api.<DOMAIN>`),
#         also auch Fluten auf teure Routen und Scans gegen /v1/internal.
#         Bewusst grosszuegiger eingestellt (siehe Jail): ein REST-Client mit
#         abgelaufenem Token oder eine Web-Sitzung, die ablaeuft, erzeugt
#         ebenfalls 401er — aber nicht Dutzende pro Minute ueber Minuten.
#
# Bewusst NIE gezaehlt:
#   * mcp.<DOMAIN> — ein MCP-Client eines Kunden ist eine einzelne IP mit hoher
#     legitimer Rate und langen SSE-Verbindungen; seine Limits setzt die App
#     (McpLimitService). Keine der Regeln passt auf diesen Host.
#   * /v1/health — der Healthcheck darf sich nie selbst aussperren.
#   * app.<DOMAIN> — liefert nur die statische SPA.
#   * 2xx/3xx/404/5xx — ein Fehler des Servers ist kein Angriff des Clients.
#
# Warum der Regex nicht ueber Header-Werte auszutricksen ist: Caddy schreibt
# die Felder in fester Reihenfolge (`request.remote_ip` zuerst, `status` nach
# dem gesamten `request`-Objekt), und jeder Anfuehrungsstrich in einem vom
# Client kontrollierten Wert (User-Agent, URI, Header) steht escaped als `\"`
# in der Zeile. Ein Muster wie `"status":401` kann deshalb nur aus dem echten
# Statusfeld stammen, und `<ADDR>` nur aus `remote_ip`. Der Filtertest
# (deploy/hetzner/tests/test_fail2ban_filter.sh) prueft genau diesen Fall mit.
#
# `remote_ip` statt `client_ip`: Caddy hat keine `trusted_proxies`, beide
# Felder sind gleich. Wuerde spaeter ein Proxy davorgeschaltet, muesste hier
# `client_ip` stehen — sonst sperrt die Jail den Proxy.

[INCLUDES]

before =

[Definition]

mode = auth

# Gemeinsamer Anfang jeder Zeile bis einschliesslich Methode. `<ADDR>` ist die
# IP, die fail2ban sperrt.
_req = ^.*?"request":\{"remote_ip":"<ADDR>","remote_port":"\d+","client_ip":"[^"]*","proto":"[^"]*","method":"[A-Z]+",

# Abschluss: das echte Statusfeld steht direkt vor `resp_headers`.
_status_auth = .*"status":(?:400|401|403|422|429),"resp_headers"
_status_edge = .*"status":(?:401|403|429),"resp_headers"

# Pfad-Ende: Ende des Pfads, Query oder weiteres Segment — aber kein laengeres
# Wort (`/oauth/tokenX` zaehlt nicht).
_end = (?:[?/][^"]*)?"

mdre-auth = %(_req)s"host":"supabase\.[^"]*","uri":"/auth/v1/(?:token|signup|recover|otp|magiclink|verify|resend)%(_end)s%(_status_auth)s
            %(_req)s"host":"api\.[^"]*","uri":"/oauth/(?:token|register|authorize)%(_end)s%(_status_auth)s

mdre-edge = %(_req)s"host":"api\.[^"]*","uri":"(?!/v1/health%(_end)s)/[^"]*"%(_status_edge)s

failregex = <mdre-<mode>>

ignoreregex =

# Caddy schreibt die Zeit als Unix-Epoche mit Nachkommastellen (`"ts":1792178140.55`).
datepattern = "ts":{EPOCH}

# Eine Zeile pro Anfrage, kein Mehrzeilen-Kontext.
maxlines = 1
