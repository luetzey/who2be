# Prod-App-Stack fuer Hetzner. Postgres + GoTrue + Studio liegen im
# separaten Supabase-Compose (Task C2, deploy/hetzner/supabase/) — dieser
# Stack hier konsumiert sie ueber das externe Docker-Netzwerk `supabase-net`.
#
# Caddy terminiert HTTPS via Let's-Encrypt auf zwei Subdomains:
#   api.${DOMAIN} -> api:8000
#   app.${DOMAIN} -> web:80
#
# MCP laeuft im `mcp`-Profil und wird nicht beim normalen `up` gestartet
# (Default-Transport ist stdio); per `docker compose run --rm mcp ...`
# als interner Consumer/Smoke-Harness aufrufbar.
services:
  migrate:
    image: ghcr.io/luetzey/who2be-api:${API_IMAGE_TAG:-latest}
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    command: ["who2be-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks: [supabase-net]
    restart: "no"

  api:
    image: ghcr.io/luetzey/who2be-api:${API_IMAGE_TAG:-latest}
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-30/minute}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # OAuth-Remote-MCP-Connector (ADR-0036): die API ist OAuth-2.1-AS. Die URLs
      # leiten sich aus ${DOMAIN} ab (wie Caddys api./app./mcp.-Bloecke).
      # MCP_RESOURCE_URL muss der vom MCP-Server advertisierten Resource gleichen
      # (= WHO2BE_MCP_PUBLIC_URL + WHO2BE_HTTP_PATH, siehe mcp-http unten).
      OAUTH_ISSUER_URL: https://api.${DOMAIN}
      OAUTH_CONSENT_URL: https://app.${DOMAIN}/oauth/consent
      MCP_RESOURCE_URL: https://mcp.${DOMAIN}/mcp
      # WorkArea-Ingest (ADR-0048): Endpoint host:port OHNE Schema; im
      # app-net unverschluesselt (SECURE=false) — der Verkehr verlaesst das
      # interne Netz nicht. Ohne diese Werte liefern NUR Ingest und
      # Blob-Reads 503 `blobstore_unconfigured`; alles andere laeuft.
      # SeaweedFS statt MinIO (#525/#529, WP2) — S3-Port ist 8333 (MinIO: 9000).
      WHO2BE_BLOBSTORE_ENDPOINT: seaweedfs:8333
      WHO2BE_BLOBSTORE_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:-who2be}
      WHO2BE_BLOBSTORE_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
      WHO2BE_BLOBSTORE_BUCKET: ${WHO2BE_BLOBSTORE_BUCKET:-who2be-blobs}
      WHO2BE_BLOBSTORE_SECURE: "false"
      # Tabellen-Store (ADR-0049): eine SQLite-Datei je WorkArea. MUSS auf ein
      # Volume zeigen — ohne den Mount lebt der Store im Container und ist
      # nach jedem Redeploy weg (stiller Datenverlust statt Fehlermeldung).
      # Backup: `VACUUM INTO`-Snapshots, siehe RUNBOOK.
      WHO2BE_TABLESTORE_DIR: /data/tablestore
      # NICHT REPLIZIEREN und KEINE `--workers` setzen (ADR-0049-Nachtrag
      # 2026-08-16): der Tabellen-Store serialisiert Schreibzugriffe ueber
      # einen prozesslokalen Lock. Ein zweiter Prozess oder Container haette
      # einen eigenen Lock auf derselben SQLite-Datei — die Folge waere stille
      # Korruption, kein Fehler. Ein Start-Guard faengt `--workers` ab, aber
      # mehrere Container kann er prinzipiell nicht sehen. Horizontal skaliert
      # wird erst mit area-affinem Routing (offener ADR).
    volumes:
      - tablestore-data:/data/tablestore
    depends_on:
      migrate:
        condition: service_completed_successfully
      blobstore-bootstrap:
        condition: service_completed_successfully
    networks: [supabase-net, app-net]
    restart: unless-stopped
    # Bewusst KEIN ports: — Zugriff nur ueber Caddy. Damit ist
    # `--forwarded-allow-ips *` (siehe apps/api/Dockerfile) safe.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Content-addressed Blob-Storage fuer den WorkArea-Ingest (ADR-0048).
  # SeaweedFS (Apache-2.0) statt MinIO (#525/#529, WP1/WP2) — Begruendung siehe
  # docker-compose.yml (Repo-Root) und den Umstiegsplan unter `.claude/plan/`.
  # Bewusst NUR im app-net und OHNE ports: — der Objekt-Store ist ein internes
  # Backend; Caddy routet ihn nicht. Master-UI (9333) bei Bedarf per
  # SSH-Tunnel (RUNBOOK).
  seaweedfs:
    # Digest-gepinnt statt nur Tag — Objekt-Storage-Daten sollen nicht an einem
    # impliziten Image-Sprung haengen (identisch zum lokalen Stack, WP1).
    image: chrislusf/seaweedfs:4.22@sha256:84429e5f21fad82246f5cfae7b39e9a17da18afb62f2b79c25ccd364ab02793b
    # Credential-Datei s3.json: SeaweedFS erlaubt OHNE `-s3.config` anonymen
    # Zugriff auf alle S3-Operationen (Doku woertlich) — die Datei ist ein
    # Sicherheits-Gate, keine Kuer. Der lokale Stack mountet dafuer eine
    # statische scripts/seaweedfs-s3.json — das geht hier NICHT: Docker
    # substituiert in gemounteten Dateien keine Variablen, also stuenden dort
    # entweder Dev-Credentials (scripts/seaweedfs-s3.json) oder wir muessten
    # ein zweites, git-fremdes Secret-Artefakt auf dem Host pflegen (eine
    # JSON-Datei NEBEN der etablierten `deploy/hetzner/.env`, Mode 600, RUNBOOK
    # §Secret-Rotation) — ein zusaetzlicher Rotationsweg fuer denselben Zweck.
    # Stattdessen wird s3.json beim Container-Start AUS
    # SEAWEEDFS_S3_ACCESS_KEY/_SECRET_KEY gerendert: dieselbe Compose-Datei-
    # Interpolation (`${VAR}` aus `--env-file deploy/hetzner/.env`), die der
    # bisherige Bootstrap-Service (`mc alias set ...`) hier bereits genutzt hat
    # — kein neuer Mechanismus, nur ein Ziel mehr fuer dasselbe `.env`-Secret.
    # `entrypoint`/`command` bewusst als YAML-Listen (statt eines
    # String-Blocks): Compose reicht jedes Listenelement unveraendert als
    # eigenes argv-Element durch, ohne es selbst nochmal shell-zu parsen — die
    # JSON-Anfuehrungszeichen im `printf`-Format muessen dadurch nicht
    # gegen eine aeussere Shell-Quotierung escaped werden. `set -eu` + `exec`
    # am Ende: bricht bei Fehlern hart ab statt mit leerer/kaputter s3.json
    # weiterzulaufen, und weed erbt PID 1 (sauberes Signal-Handling).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"who2be","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "${SEAWEEDFS_S3_ACCESS_KEY:-who2be}" "${SEAWEEDFS_S3_SECRET_KEY}" > /etc/seaweedfs/s3.json
        exec weed server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    environment:
      # Guard fuer SEAWEEDFS_S3_SECRET_KEY (fail closed, s. `entrypoint` oben,
      # wo der Wert tatsaechlich verwendet wird — dieser Eintrag existiert nur
      # wegen des `:?`). KEIN Default: ein Objekt-Store mit vorhersagbaren
      # Credentials auf einer oeffentlich erreichbaren Maschine ist eine offene
      # Tuer. Fehlt die Variable, bricht der Compose-Up hier ab (fail closed) —
      # analog zu MINIO_ROOT_PASSWORD vorher.
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?SEAWEEDFS_S3_SECRET_KEY setzen (Objekt-Store-Secret-Key)}
    volumes:
      - seaweedfs-data:/data
    networks: [app-net]
    restart: unless-stopped
    healthcheck:
      # NICHT `8333/healthz` (seaweedfs#8243, s. lokaler Stack) — Master-Port
      # hat den echten Status-Endpunkt.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Einmal-Service: legt den Bucket an (idempotent bei jedem Deploy). Faehrt
  # das API-Image statt eines eigenen CLI-Images (das S3-SDK aus dem API-Code,
  # Apache-2.0, ist dort ohnehin Kern-Dependency, ADR-0048) — identisches
  # Muster zum lokalen Stack (WP1: `scripts/blobstore-bootstrap.py`).
  blobstore-bootstrap:
    image: ghcr.io/luetzey/who2be-api:${API_IMAGE_TAG:-latest}
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    entrypoint: ["python", "/scripts/blobstore-bootstrap.py"]
    environment:
      BLOBSTORE_ENDPOINT: seaweedfs:8333
      BLOBSTORE_BUCKET: ${WHO2BE_BLOBSTORE_BUCKET:-who2be-blobs}
      # Muessen zu den SEAWEEDFS_S3_*-Werten oben passen (dieselben Variablen).
      BLOBSTORE_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:-who2be}
      BLOBSTORE_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
    volumes:
      - ../../../scripts/blobstore-bootstrap.py:/scripts/blobstore-bootstrap.py:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks: [app-net]
    restart: "no"

  web:
    image: ghcr.io/luetzey/who2be-web:${WEB_IMAGE_TAG:-latest}
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_MCP_URL: ${VITE_MCP_URL:-}
        # Public-Signup in der UI ausblenden (true), gemeinsam mit dem
        # Backend-GOTRUE_DISABLE_SIGNUP setzen. Default false.
        VITE_WHO2BE_SIGNUP_DISABLED: ${VITE_WHO2BE_SIGNUP_DISABLED:-false}
        # Edition des Web-Bundles (ADR-0029): onprem (Default) shaked die
        # Billing-UI aus dem Bundle; das Cloud-Overlay pinnt hier `cloud`.
        VITE_WHO2BE_EDITION: ${VITE_WHO2BE_EDITION:-onprem}
    # Runtime-Config (schlaegt die Build-Args oben): das von der CI gebaute
    # Image ist bewusst host-neutral, hier bekommt es die echten Adressen. Ohne
    # diesen Block spraeche die App Same-Origin — unter app.<domain> also gegen
    # sich selbst statt gegen api.<domain>.
    environment:
      WHO2BE_API_BASE_URL: ${VITE_API_BASE_URL}
      WHO2BE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      WHO2BE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      WHO2BE_MCP_URL: ${VITE_MCP_URL:-}
      WHO2BE_SIGNUP_DISABLED: ${VITE_WHO2BE_SIGNUP_DISABLED:-false}
      # "Wir arbeiten noch"-Modus (#429). Ohne dieses Durchreichen bleibt
      # `/config.js` auf "open", egal was in der `.env` steht.
      # GOTRUE_DISABLE_SIGNUP bleibt separat und wird gemeinsam gesetzt.
      WHO2BE_LAUNCH_MODE: ${WHO2BE_LAUNCH_MODE:-open}
      WHO2BE_LAUNCH_CONTACT: ${WHO2BE_LAUNCH_CONTACT:-}
      # Absolute Obergrenze der "Angemeldet bleiben"-Sitzung in Stunden
      # (#430/#470, ADR-0052). Gueltig ist 1-24; die Web-App faellt bei
      # fehlendem/ungueltigem Wert fail-closed auf 12 zurueck. Muss wie
      # WHO2BE_LAUNCH_MODE durchgereicht werden, sonst sieht der Entrypoint
      # den Wert nie und /config.js bleibt still auf dem Default.
      WHO2BE_SESSION_MAX_AGE_HOURS: ${WHO2BE_SESSION_MAX_AGE_HOURS:-12}
      # Turnstile-Site-Key fuer das Captcha auf /signup (#539). LEER = kein
      # Widget, Signup laeuft exakt wie bisher. Gehoert paarweise zu
      # GOTRUE_SECURITY_CAPTCHA_* im Supabase-Stack (supabase/.env): Site-Key
      # hier (oeffentlich, steht im HTML), Secret dort (nie in die Web-App).
      # Nur eine der beiden Seiten zu setzen bricht den Signup.
      WHO2BE_TURNSTILE_SITE_KEY: ${WHO2BE_TURNSTILE_SITE_KEY:-}
    networks: [app-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Stdio-Variante (Default). One-Shot per `docker compose run --rm mcp ...`,
  # nicht beim normalen `up` aktiv (profile=mcp).
  mcp:
    image: ghcr.io/luetzey/who2be-mcp:${MCP_IMAGE_TAG:-latest}
    build:
      context: ../../..
      dockerfile: apps/mcp/Dockerfile
    environment:
      WHO2BE_API_BASE_URL: http://api:8000
      WHO2BE_API_TOKEN: ${WHO2BE_API_TOKEN:-}
      WHO2BE_LOG_FORMAT: ${LOG_FORMAT:-json}
      WHO2BE_TRANSPORT: stdio
    networks: [app-net]
    profiles: ["mcp"]
    restart: "no"
    # Stdio-Container hat keinen offenen Port — Healthcheck aus.
    healthcheck:
      disable: true

  # HTTP-Variante: Long-Running Streamable-HTTP-Server auf 0.0.0.0:8765/mcp.
  # Aktiv mit `--profile mcp-http`. Caddy proxy'iert `mcp.${DOMAIN}` darauf
  # (siehe deploy/hetzner/Caddyfile). ADR-0034.
  mcp-http:
    image: ghcr.io/luetzey/who2be-mcp:${MCP_IMAGE_TAG:-latest}
    build:
      context: ../../..
      dockerfile: apps/mcp/Dockerfile
    environment:
      WHO2BE_API_BASE_URL: http://api:8000
      WHO2BE_API_TOKEN: ${WHO2BE_API_TOKEN:-}
      WHO2BE_LOG_FORMAT: ${LOG_FORMAT:-json}
      WHO2BE_TRANSPORT: http
      WHO2BE_HTTP_HOST: 0.0.0.0
      WHO2BE_HTTP_PORT: "8765"
      WHO2BE_HTTP_PATH: /mcp
      # OAuth-Resource-Server (ADR-0036): zeigt im PRM auf die API als
      # Authorization-Server und advertisiert die eigene Resource-URL (Origin
      # ohne Pfad — FastMCP haengt WHO2BE_HTTP_PATH an, ergibt
      # https://mcp.${DOMAIN}/mcp = MCP_RESOURCE_URL der API).
      WHO2BE_OAUTH_ISSUER_URL: https://api.${DOMAIN}
      WHO2BE_MCP_PUBLIC_URL: https://mcp.${DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    networks: [app-net]
    profiles: ["mcp-http"]
    restart: unless-stopped
    # Healthcheck aus dem Dockerfile bleibt aktiv — Streamable-HTTP-Endpunkt
    # antwortet auf GET mit `Accept: text/event-stream`.

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # supabase-net: damit Caddy auch `supabase.<DOMAIN>` auf den
    # auth-gateway aus dem Supabase-Stack (MS-2 C2) proxy'en kann.
    networks: [app-net, supabase-net]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # C5a/C5b — pg_dump | gpg lokal + restic offsite.
  # Default-up startet diesen Service NICHT (profile=backup). Host-Cron triggert:
  #   15 3 * * * cd /opt/who2be && docker compose --profile backup run --rm backup
  # GPG-Keyring und SSH-Keys werden vom Host gemountet — auf Hetzner liegen sie
  # in /opt/who2be/secrets/{gpg,ssh} (Mode 600/700, Owner deploy).
  backup:
    build:
      context: ..
      dockerfile: backup/Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT}
      BACKUP_DIR: /var/backups/who2be
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_SSH_KEY: /secrets/storage_box_ed25519
    volumes:
      - backups:/var/backups/who2be
      - ${BACKUP_GPG_HOME:-/opt/who2be/secrets/gpg}:/root/.gnupg:ro
      - ${BACKUP_SSH_HOME:-/opt/who2be/secrets/ssh}:/secrets:ro
    networks: [supabase-net]
    profiles: ["backup"]
    restart: "no"

networks:
  app-net:
    driver: bridge
  # supabase-net wird vom Supabase-Compose (Task C2) angelegt. Bis C2 existiert,
  # kann fuer den lokalen Smoke das Override-File docker-compose.local.yml
  # benutzt werden, das den Postgres direkt mit einbringt.
  supabase-net:
    external: true

volumes:
  caddy-data:
  caddy-config:
  backups:
  # Objekt-Store (ADR-0048) und Tabellen-Store (ADR-0049) sind Nutzdaten wie
  # die DB — beide MUESSEN persistent sein, sonst verliert jeder Redeploy
  # Blobs bzw. Area-Tabellen. Backup-Pfade: RUNBOOK.
  seaweedfs-data:
  tablestore-data:
