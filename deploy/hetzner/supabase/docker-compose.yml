# Self-hosted Supabase-Stack fuer Hetzner (MS-2 C2).
# Minimaler Scope: Postgres + GoTrue (Auth) + nginx-Gateway. Studio ist
# unter Profil "studio" registriert (default off) — explizit per
# `--profile studio up -d` zu aktivieren.
#
# Reihenfolge auf dem Server:
#   1. supabase-Stack starten (dieser File) — erzeugt supabase-net.
#   2. who2be-Stack (deploy/hetzner/who2be/docker-compose.yml) — haengt
#      sich per `external: true` ins supabase-net rein.
services:
  db:
    image: supabase/postgres:15.1.1.78
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: postgres
      # KEIN POSTGRES_USER: die Image-Init braucht die Default-Superuser-Rolle
      # `postgres`. Mit POSTGRES_USER=supabase_admin bricht sie mit
      # `role "postgres" does not exist` ab → supabase_auth_admin fehlt → GoTrue
      # scheitert. Ohne legt das Image supabase_admin + supabase_auth_admin (mit
      # POSTGRES_PASSWORD) selbst an. Verifiziert.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      # KEIN init-Mount: `supabase/postgres` initialisiert seine Rollen
      # (supabase_admin, supabase_auth_admin, anon, …) + auth/storage-Schemata
      # selbst ueber ins Image gebackene Init-Skripte. Ein Mount auf
      # /docker-entrypoint-initdb.d verdeckt die und bricht GoTrue. (Verifiziert.)
    networks: [supabase-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Einmal-Service: setzt das Passwort von supabase_auth_admin auf
  # POSTGRES_PASSWORD. Das supabase/postgres-Image legt diese GoTrue-Rolle an,
  # aber OHNE Passwort (nur lokal-`trust`) — GoTrue verbindet per TCP (scram) →
  # scheitert sonst mit "has no password assigned". Laeuft als supabase_admin
  # (hat POSTGRES_PASSWORD per TCP), idempotent bei jedem Deploy.
  db-roles:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ROLE_PW: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        until pg_isready; do echo "warte auf db..."; sleep 2; done
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE supabase_auth_admin WITH LOGIN PASSWORD '$$ROLE_PW'"
    depends_on:
      db:
        condition: service_healthy
    networks: [supabase-net]
    restart: "no"

  auth:
    image: supabase/gotrue:v2.158.1
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL}
      # Redirect-Allowlist gehaertet: nur der eigene App-Origin (exakt + alle
      # In-App-Pfade darunter). Deckt die Reset-/Confirm-/OAuth-Callback-Routen
      # ab, ohne fremde Origins zuzulassen (Open-Redirect-Schutz, Track K).
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL},${SITE_URL}/*
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: https://supabase.${DOMAIN}/auth/v1
      # MFA / TOTP (WP-F, Befund S1): Zwei-Faktor per TOTP. Nach verifizierter
      # Challenge setzt GoTrue `aal=aal2` im JWT; die Who2Be-API erzwingt aal2
      # fuer Admin-Aktionen (core/security.require_aal2). Admins MUESSEN einen
      # TOTP-Faktor einrichten (docs/mfa-admin.md). v2.158.1 hat KEIN
      # Top-Level GOTRUE_MFA_ENABLED — TOTP wird pro Faktor geschaltet.
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: ${GOTRUE_MFA_TOTP_ENROLL_ENABLED:-true}
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: ${GOTRUE_MFA_TOTP_VERIFY_ENABLED:-true}
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: ${GOTRUE_MFA_MAX_ENROLLED_FACTORS:-10}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Prod: E-Mail-Verifikation AN (default false = Confirm Pflicht). Mit
      # GOTRUE_MAILER_AUTOCONFIRM=true im .env laesst sich das fuer einen
      # frischen Staging-Stack ohne SMTP voruebergehend umgehen.
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
      # Echter SMTP-Mailer (Track K) — Pflicht, sobald Autoconfirm aus ist.
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-Who2Be}
      # Mail-Link-Ziele (relativ zu SITE_URL): Confirm/Email-Change landen auf
      # der OAuth-/Confirm-Callback-Route, Recovery auf der Set-Password-Seite.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/callback
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/callback
      GOTRUE_MAILER_URLPATHS_RECOVERY: /onboarding/set-password
      GOTRUE_MAILER_URLPATHS_INVITE: /invitations
      # Social-Login (Track K) — default AUS; pro Provider per .env aktivieren.
      # Die Provider-Redirect-URI zeigt auf die GoTrue-Callback-Route hinter
      # dem auth-gateway (/auth/v1/callback → intern /callback).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-https://supabase.${DOMAIN}/auth/v1/callback}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI:-https://supabase.${DOMAIN}/auth/v1/callback}
      API_EXTERNAL_URL: https://supabase.${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks: [supabase-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./auth-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
    networks: [supabase-net]
    restart: unless-stopped
    healthcheck:
      # nginx-alpine hoert nur IPv4 — `localhost` aufloesst in der
      # Image-Default zu ::1, daher 127.0.0.1.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  meta:
    image: supabase/postgres-meta:v0.83.2
    profiles: ["studio"]
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [supabase-net]
    restart: unless-stopped

  studio:
    image: supabase/studio:20240624-2eb04f3
    profiles: ["studio"]
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Who2Be
      DEFAULT_PROJECT_NAME: Who2Be
      SUPABASE_URL: https://supabase.${DOMAIN}
      SUPABASE_PUBLIC_URL: https://supabase.${DOMAIN}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    depends_on:
      - meta
    networks: [supabase-net]
    restart: unless-stopped

networks:
  supabase-net:
    # Expliziter Name ohne Compose-Projekt-Prefix — der App-Stack
    # (deploy/hetzner/who2be/docker-compose.yml) bindet sich per
    # `external: true` exakt auf diesen Namen.
    name: supabase-net
    driver: bridge

volumes:
  db-data:
