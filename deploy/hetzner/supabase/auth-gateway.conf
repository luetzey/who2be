# Supabase-API-Gateway fuer den Hetzner-Stack (MS-2 C2).
# supabase-js spricht `${supabaseUrl}/auth/v1/*`; GoTrue servt aber unter `/`.
# Dieser Reverse-Proxy strippt den Prefix UND beantwortet den CORS-Preflight
# selbst (GoTrue ignoriert OPTIONS sonst). Caddy (deploy/hetzner/Caddyfile)
# proxied `supabase.<DOMAIN>` auf diesen Gateway-Container im supabase-net.
# Eine spaetere Migration auf Kong ist disjunkt zu C2.
server {
    listen 9999;
    server_name _;

    # OAuth-Callback (Google/GitHub) bringt eine grosse state/code-Query, dazu
    # haengt der Browser angesammelte Cookies an — das sprengt nginx'
    # Default-Header-Puffer (4x8k) und liefert 400 "Request Header Or Cookie Too
    # Large". Groessere Puffer fuer den Auth-Callback.
    large_client_header_buffers 8 32k;
    client_header_buffer_size   16k;

    # Dockers eingebetteter DNS (127.0.0.11) wird via Variable + Resolver pro
    # Request neu konsultiert. Ohne Variable resolved nginx den `auth`-Upstream
    # nur EINMAL beim Worker-Start und cached die IP fuer dessen Lebenszeit —
    # wenn `compose up` den Auth-Container recreated, hat er eine neue IP und
    # der Gateway haengt an der alten fest (502 "Connection refused"), bis man
    # auch den Gateway recreated. Mit Variable + kurzem TTL faengt der Gateway
    # den Auth-Restart selbst ab. `ipv6=off`, weil Compose-Bridge nur IPv4.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /auth/v1/ {
        # CORS-Preflight: hier komplett beantworten.
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'authorization, apikey, content-type, x-client-info, x-supabase-api-version' always;
            add_header 'Access-Control-Max-Age' '1728000' always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' '0';
            return 204;
        }

        # GoTrue setzt auf POST/GET selbst ACAO=* — doppelt waere ein
        # Browser-Error ("Access-Control-Allow-Origin contains multiple
        # values"), und ACAO=* schliesst Allow-Credentials=true zudem aus.
        # Daher GoTrues Header wegnehmen und unsere passenden setzen.
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'X-Total-Count, Link, X-Supabase-Api-Version' always;

        # Variable proxy_pass ⇒ nginx nutzt den oben gesetzten Resolver pro
        # Request statt nur einmal beim Start (siehe Header-Kommentar zu
        # `resolver`). `set` MUSS vor `rewrite … break` stehen — `break`
        # beendet die Rewrite-Phase und stoppt jeden danach folgenden
        # Rewrite-Modul-Directive (auch `set`), sonst kommt nginx zur
        # Laufzeit auf eine uninitialized variable und liefert 500.
        set $auth_upstream "http://auth:9999";
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
