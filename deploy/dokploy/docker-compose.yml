# Who2Be — kombinierter Stack fuer Dokploy (On-Prem-Edition, Staging-E2E).
#
# Anders als deploy/hetzner/* (zwei Compose-Files + Caddy + externe Netze) ist
# das HIER EIN Stack ohne Caddy: Dokploys Traefik uebernimmt Routing + TLS.
# Die vier Subdomains mappst du in der Dokploy-UI auf die Dienste:
#   api.<DOMAIN>      -> api:8000        (OAuth-Authorization-Server)
#   app.<DOMAIN>      -> web:80          (Consent-UI)
#   supabase.<DOMAIN> -> auth-gateway:9999
#   mcp.<DOMAIN>      -> mcp-http:8765   (OAuth-Resource-Server)
#
# Images werden AUS DEM QUELLCODE gebaut (die ghcr-:latest-Images sind veraltet
# und das Web-Image ist domain-fest zur Build-Zeit). Anleitung:
# docs/oauth-e2e-dokploy.md.
#
# Pflicht-Env (in Dokploy → Environment): DOMAIN, POSTGRES_PASSWORD, JWT_SECRET
# (>=32 Zeichen), VITE_SUPABASE_ANON_KEY (JWT role=anon, signiert mit JWT_SECRET
# via scripts/gen_test_jwt.py), SEAWEEDFS_S3_SECRET_KEY (Objekt-Store, ADR-0048
# — ohne Wert bricht der Stack bewusst ab). Fuer einen Staging-Smoke ohne SMTP:
# GOTRUE_MAILER_AUTOCONFIRM=true.
#
# Persistente Nutzdaten liegen in DREI Volumes: db-data (Postgres),
# seaweedfs-data (Blobs, ADR-0048) und tablestore-data (SQLite je WorkArea,
# ADR-0049). Alle drei muessen ein Redeploy ueberleben.

services:
  db:
    image: supabase/postgres:15.1.1.78
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: postgres
      # KEIN POSTGRES_USER setzen: die Image-Init (migrate.sh → 00-schema.sql)
      # braucht die Default-Superuser-Rolle `postgres`. Mit POSTGRES_USER=
      # supabase_admin legt der Entrypoint stattdessen supabase_admin als
      # Superuser an → die Init bricht mit `role "postgres" does not exist` ab →
      # supabase_auth_admin wird nie erzeugt. Ohne POSTGRES_USER legt das Image
      # supabase_admin + supabase_auth_admin (beide mit POSTGRES_PASSWORD) selbst
      # an. Empirisch verifiziert (App- + GoTrue-Migrationen laufen durch).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
      # KEIN init-Mount: `supabase/postgres` legt seine Rollen (supabase_admin,
      # supabase_auth_admin, anon, authenticated, …) + die auth/storage-Schemata
      # ueber EIGENE, ins Image gebackene Init-Skripte in
      # /docker-entrypoint-initdb.d an. Ein Volume-Mount dorthin VERDECKT die und
      # bricht GoTrue ("password authentication failed for supabase_auth_admin"
      # bzw. "no schema selected"). Empirisch verifiziert.
    networks: [who2be]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Einmal-Service: setzt das Passwort von supabase_auth_admin auf
  # POSTGRES_PASSWORD. Das supabase/postgres-Image LEGT diese GoTrue-Rolle an,
  # aber OHNE Passwort (nur lokal-`trust` nutzbar). GoTrue verbindet per TCP
  # (scram) → scheitert sonst mit "has no password assigned". Laeuft als
  # supabase_admin (hat POSTGRES_PASSWORD per TCP), idempotent bei jedem Deploy.
  db-roles:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ROLE_PW: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        until pg_isready; do echo "warte auf db..."; sleep 2; done
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE supabase_auth_admin WITH LOGIN PASSWORD '$$ROLE_PW'"
    depends_on:
      db:
        condition: service_healthy
    networks: [who2be]
    restart: "no"

  auth:
    image: supabase/gotrue:v2.158.1
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: https://app.${DOMAIN}
      GOTRUE_URI_ALLOW_LIST: https://app.${DOMAIN},https://app.${DOMAIN}/*
      # Public-Signup an/aus. `true` blockt neue Registrierungen (POST /signup
      # → 422), Bestands-Logins + Admin-Invites bleiben erlaubt. In Dokploy
      # ueber die Env `GOTRUE_DISABLE_SIGNUP=true` setzen.
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      # Captcha vor der Registrierung (Issue #539, Cloudflare Turnstile).
      # Namen gegen die gepinnte v2.158.1 verifiziert
      # (internal/conf/configuration.go:423-427/:495/:257, envconfig-Praefix
      # "gotrue" in :653): das Secret heisst `..._CAPTCHA_SECRET`, NICHT
      # `..._CAPTCHA_PROVIDER_SECRET`. ENABLED=false ueberspringt die
      # Validierung ⇒ leer gelassen bleibt das Verhalten unveraendert; bei
      # `true` muss das Secret gesetzt sein, sonst startet GoTrue nicht.
      # Wirkt auch auf /recover, /resend, /magiclink, /otp, /sso und den
      # Passwort-Login — Admin-Calls (Invite-Versand) sind ausgenommen.
      # Details: docs/signup-and-invites.md §3.
      GOTRUE_SECURITY_CAPTCHA_ENABLED: ${GOTRUE_SECURITY_CAPTCHA_ENABLED:-false}
      GOTRUE_SECURITY_CAPTCHA_PROVIDER: ${GOTRUE_SECURITY_CAPTCHA_PROVIDER:-turnstile}
      GOTRUE_SECURITY_CAPTCHA_SECRET: ${GOTRUE_SECURITY_CAPTCHA_SECRET:-}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: https://supabase.${DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Staging-Smoke: Autoconfirm AN ⇒ kein SMTP noetig (Signups sofort nutzbar).
      # Fuer Prod auf false + GOTRUE_SMTP_* setzen.
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/callback
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/callback
      GOTRUE_MAILER_URLPATHS_RECOVERY: /onboarding/set-password
      GOTRUE_MAILER_URLPATHS_INVITE: /invitations
      API_EXTERNAL_URL: https://supabase.${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks: [who2be]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ../hetzner/supabase/auth-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
    networks: [who2be, dokploy-network]
    restart: unless-stopped
    expose:
      - "9999"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.who2be-supabase.rule=Host(`supabase.${DOMAIN}`)"
      - "traefik.http.routers.who2be-supabase.entrypoints=websecure"
      - "traefik.http.routers.who2be-supabase.tls.certResolver=letsencrypt"
      - "traefik.http.services.who2be-supabase.loadbalancer.server.port=9999"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["who2be-migrate"]
    environment:
      DATABASE_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    networks: [who2be]
    restart: "no"

  # Content-addressed Blob-Storage fuer den WorkArea-Ingest (ADR-0048).
  # SeaweedFS (Apache-2.0) statt MinIO (#525/#529, WP1/WP2) — Begruendung siehe
  # docker-compose.yml (Repo-Root) und den Umstiegsplan unter `.claude/plan/`.
  # BEWUSST NICHT im dokploy-network und ohne Traefik-Labels: der Objekt-Store
  # ist ein internes Backend, keine oeffentliche Flaeche. Die App erreicht ihn
  # ueber das `who2be`-Netz; wer die Master-UI (9333) braucht, tunnelt
  # (RUNBOOK).
  seaweedfs:
    # Digest-gepinnt statt nur Tag — Objekt-Storage-Daten sollen nicht an einem
    # impliziten Image-Sprung haengen (identisch zum lokalen Stack, WP1).
    image: chrislusf/seaweedfs:4.22@sha256:84429e5f21fad82246f5cfae7b39e9a17da18afb62f2b79c25ccd364ab02793b
    # Credential-Datei s3.json: SeaweedFS erlaubt OHNE `-s3.config` anonymen
    # Zugriff auf alle S3-Operationen (Doku woertlich) — die Datei ist ein
    # Sicherheits-Gate, keine Kuer. Der lokale Stack mountet dafuer eine
    # statische scripts/seaweedfs-s3.json — das geht hier NICHT: Docker
    # substituiert in gemounteten Dateien keine Variablen, also stuenden dort
    # entweder Dev-Credentials (scripts/seaweedfs-s3.json) oder wir muessten
    # ein zweites, git-fremdes Secret-Artefakt auf dem Host pflegen (eine
    # JSON-Datei NEBEN der etablierten Dokploy-`Environment`, ein zusaetzlicher
    # Rotationsweg fuer denselben Zweck). Stattdessen wird s3.json beim
    # Container-Start AUS SEAWEEDFS_S3_ACCESS_KEY/_SECRET_KEY gerendert:
    # dieselbe Compose-Datei-Interpolation (`${VAR}`), die der bisherige
    # Bootstrap-Service (`mc alias set ...`) hier bereits genutzt hat — kein
    # neuer Mechanismus, nur ein Ziel mehr fuer dasselbe Secret.
    # `entrypoint`/`command` bewusst als YAML-Listen (statt eines
    # String-Blocks): Compose reicht jedes Listenelement unveraendert als
    # eigenes argv-Element durch, ohne es selbst nochmal shell-zu parsen — die
    # JSON-Anfuehrungszeichen im `printf`-Format muessen dadurch nicht gegen
    # eine aeussere Shell-Quotierung escaped werden. `set -eu` + `exec` am
    # Ende: bricht bei Fehlern hart ab statt mit leerer/kaputter s3.json
    # weiterzulaufen, und weed erbt PID 1 (sauberes Signal-Handling).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"who2be","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "${SEAWEEDFS_S3_ACCESS_KEY:-who2be}" "${SEAWEEDFS_S3_SECRET_KEY}" > /etc/seaweedfs/s3.json
        exec weed server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    environment:
      # Guard fuer SEAWEEDFS_S3_SECRET_KEY (fail closed, s. `entrypoint` oben,
      # wo der Wert tatsaechlich verwendet wird — dieser Eintrag existiert nur
      # wegen des `:?`). KEIN Default: ein Objekt-Store mit vorhersagbaren
      # Credentials in einer oeffentlich deployten Umgebung ist eine offene
      # Tuer. Fehlt die Variable, bricht `docker compose up` ab — fail closed,
      # analog zu MINIO_ROOT_PASSWORD vorher.
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?SEAWEEDFS_S3_SECRET_KEY setzen (Objekt-Store-Secret-Key)}
    volumes:
      - seaweedfs-data:/data
    networks: [who2be]
    restart: unless-stopped
    healthcheck:
      # NICHT `8333/healthz` (seaweedfs#8243, s. lokaler Stack) — Master-Port
      # hat den echten Status-Endpunkt.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Einmal-Service: legt den Bucket an (idempotent). Faehrt das API-Image statt
  # eines eigenen CLI-Images (das S3-SDK aus dem API-Code, Apache-2.0, ist dort
  # ohnehin Kern-Dependency, ADR-0048) — identisches Muster zum lokalen Stack
  # (WP1: `scripts/blobstore-bootstrap.py`).
  blobstore-bootstrap:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    entrypoint: ["python", "/scripts/blobstore-bootstrap.py"]
    environment:
      BLOBSTORE_ENDPOINT: seaweedfs:8333
      BLOBSTORE_BUCKET: ${WHO2BE_BLOBSTORE_BUCKET:-who2be-blobs}
      # Muessen zu den SEAWEEDFS_S3_*-Werten oben passen (dieselben Variablen).
      BLOBSTORE_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:-who2be}
      BLOBSTORE_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
    volumes:
      - ../../scripts/blobstore-bootstrap.py:/scripts/blobstore-bootstrap.py:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks: [who2be]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://supabase_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: https://supabase.${DOMAIN}
      CORS_ORIGINS: https://app.${DOMAIN}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      WHO2BE_EDITION: onprem
      # OAuth-Remote-MCP-Connector (ADR-0036) — aus DOMAIN abgeleitet.
      OAUTH_ISSUER_URL: https://api.${DOMAIN}
      OAUTH_CONSENT_URL: https://app.${DOMAIN}/oauth/consent
      MCP_RESOURCE_URL: https://mcp.${DOMAIN}/mcp
      # WorkArea-Ingest (ADR-0048): Endpoint ist host:port OHNE Schema; im
      # Compose-Netz unverschluesselt (SECURE=false) — der Verkehr verlaesst
      # das interne Netz nicht. Ohne diese Werte liefern NUR Ingest und
      # Blob-Reads 503; alles andere laeuft.
      # SeaweedFS statt MinIO (#525/#529, WP2) — S3-Port ist 8333 (MinIO: 9000).
      WHO2BE_BLOBSTORE_ENDPOINT: seaweedfs:8333
      WHO2BE_BLOBSTORE_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:-who2be}
      WHO2BE_BLOBSTORE_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY}
      WHO2BE_BLOBSTORE_BUCKET: ${WHO2BE_BLOBSTORE_BUCKET:-who2be-blobs}
      WHO2BE_BLOBSTORE_SECURE: "false"
      # Tabellen-Store (ADR-0049): eine SQLite-Datei je WorkArea. MUSS auf ein
      # Volume zeigen — ohne den Mount lebt der Store im Container und ist nach
      # jedem Redeploy weg (stiller Datenverlust statt Fehlermeldung).
      WHO2BE_TABLESTORE_DIR: /data/tablestore
      # NICHT REPLIZIEREN und KEINE `--workers` setzen (ADR-0049-Nachtrag
      # 2026-08-16): der Tabellen-Store serialisiert Schreibzugriffe ueber
      # einen prozesslokalen Lock. Ein zweiter Prozess oder Container haette
      # einen eigenen Lock auf derselben SQLite-Datei — die Folge waere stille
      # Korruption, kein Fehler. Ein Start-Guard faengt `--workers` ab, aber
      # mehrere Container kann er prinzipiell nicht sehen. Horizontal skaliert
      # wird erst mit area-affinem Routing (offener ADR).
    volumes:
      - tablestore-data:/data/tablestore
    depends_on:
      migrate:
        condition: service_completed_successfully
      blobstore-bootstrap:
        condition: service_completed_successfully
    networks: [who2be, dokploy-network]
    restart: unless-stopped
    # Dokploy/Traefik-Routing fuer Docker-Compose-Dienste laeuft ueber LABELS
    # (kein UI-Domain-Mapping). Host-Regel aus ${DOMAIN} interpoliert; HTTPS via
    # Let's-Encrypt-Resolver `letsencrypt`. Eindeutiger Router-Name je Dienst.
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.who2be-api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.who2be-api.entrypoints=websecure"
      - "traefik.http.routers.who2be-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.who2be-api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      # Build-Args sind der Compile-Time-Weg (Vite) und bleiben gueltig; die
      # Runtime-Env unten spiegelt sie und gewinnt zur Laufzeit — sie greift
      # auch dann, wenn hier statt gebaut ein fertiges GHCR-Image laeuft
      # (das ist bewusst host-neutral, siehe apps/web/src/config.ts).
      args:
        VITE_API_BASE_URL: https://api.${DOMAIN}
        VITE_SUPABASE_URL: https://supabase.${DOMAIN}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_MCP_URL: https://mcp.${DOMAIN}/mcp
        VITE_WHO2BE_EDITION: onprem
        # Public-Signup in der UI ausblenden (true), gemeinsam mit dem
        # Backend-GOTRUE_DISABLE_SIGNUP setzen. Default false.
        VITE_WHO2BE_SIGNUP_DISABLED: ${VITE_WHO2BE_SIGNUP_DISABLED:-false}
    environment:
      WHO2BE_API_BASE_URL: https://api.${DOMAIN}
      WHO2BE_SUPABASE_URL: https://supabase.${DOMAIN}
      WHO2BE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      WHO2BE_MCP_URL: https://mcp.${DOMAIN}/mcp
      WHO2BE_SIGNUP_DISABLED: ${VITE_WHO2BE_SIGNUP_DISABLED:-false}
      # "Wir arbeiten noch"-Modus (#429). Ohne dieses Durchreichen bleibt
      # `/config.js` auf "open", egal was in der `.env` steht.
      # GOTRUE_DISABLE_SIGNUP bleibt separat und wird gemeinsam gesetzt.
      WHO2BE_LAUNCH_MODE: ${WHO2BE_LAUNCH_MODE:-open}
      WHO2BE_LAUNCH_CONTACT: ${WHO2BE_LAUNCH_CONTACT:-}
      # Absolute Obergrenze der "Angemeldet bleiben"-Sitzung in Stunden
      # (#430/#470, ADR-0052). Gueltig ist 1-24; die Web-App faellt bei
      # fehlendem/ungueltigem Wert fail-closed auf 12 zurueck. Muss wie
      # WHO2BE_LAUNCH_MODE durchgereicht werden, sonst sieht der Entrypoint
      # den Wert nie und /config.js bleibt still auf dem Default.
      WHO2BE_SESSION_MAX_AGE_HOURS: ${WHO2BE_SESSION_MAX_AGE_HOURS:-12}
      # Turnstile-Site-Key fuer das Captcha auf /signup (#539). LEER = kein
      # Widget, Signup laeuft exakt wie bisher. Gehoert paarweise zu
      # GOTRUE_SECURITY_CAPTCHA_* am auth-Service: Site-Key hier (oeffentlich,
      # steht im HTML), Secret dort (nie in die Web-App). Nur eine der beiden
      # Seiten zu setzen bricht den Signup — entweder beide oder keine.
      WHO2BE_TURNSTILE_SITE_KEY: ${WHO2BE_TURNSTILE_SITE_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    networks: [who2be, dokploy-network]
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.who2be-web.rule=Host(`app.${DOMAIN}`)"
      - "traefik.http.routers.who2be-web.entrypoints=websecure"
      - "traefik.http.routers.who2be-web.tls.certResolver=letsencrypt"
      - "traefik.http.services.who2be-web.loadbalancer.server.port=80"

  mcp-http:
    build:
      context: ../..
      dockerfile: apps/mcp/Dockerfile
    environment:
      WHO2BE_API_BASE_URL: http://api:8000
      WHO2BE_LOG_FORMAT: ${LOG_FORMAT:-json}
      WHO2BE_TRANSPORT: http
      WHO2BE_HTTP_HOST: 0.0.0.0
      WHO2BE_HTTP_PORT: "8765"
      WHO2BE_HTTP_PATH: /mcp
      # OAuth-Resource-Server (ADR-0036): PRM zeigt auf den AS, Resource = die
      # eigene oeffentliche URL (Origin; FastMCP haengt WHO2BE_HTTP_PATH an).
      WHO2BE_OAUTH_ISSUER_URL: https://api.${DOMAIN}
      WHO2BE_MCP_PUBLIC_URL: https://mcp.${DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    networks: [who2be, dokploy-network]
    restart: unless-stopped
    expose:
      - "8765"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.who2be-mcp.rule=Host(`mcp.${DOMAIN}`)"
      - "traefik.http.routers.who2be-mcp.entrypoints=websecure"
      - "traefik.http.routers.who2be-mcp.tls.certResolver=letsencrypt"
      - "traefik.http.services.who2be-mcp.loadbalancer.server.port=8765"

networks:
  who2be:
    driver: bridge
  # Dokploys eigenes Netz — Traefik erreicht darueber die Domain-Dienste. Vom
  # Dokploy-Installer angelegt; Name ggf. mit `docker network ls | grep dokploy`
  # pruefen und hier anpassen.
  dokploy-network:
    external: true

volumes:
  db-data:
  # Objekt-Store (ADR-0048) und Tabellen-Store (ADR-0049) sind Nutzdaten wie
  # die DB — beide MUESSEN persistent sein, sonst verliert jeder Redeploy
  # Blobs bzw. Area-Tabellen.
  seaweedfs-data:
  tablestore-data:
