# osv-scanner config for the web lockfile. osv-scanner loads it automatically
# because it sits next to package-lock.json (verified with the version pinned
# in .github/workflows/ci.yml: "Loaded filter from: .../osv-scanner.toml").
#
# Every entry is a time-boxed exception for exactly one advisory ID. No entry
# without an expiry date; when it expires the scan turns red again and the
# finding has to be re-evaluated with current data.

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-11-30T00:00:00Z
reason = """glob@13.0.6: fixed only in the new major 14.0.2, which no parent package \
accepts yet (eslint, @typescript-eslint/typescript-estree, @npmcli/* via \
license-checker-rseidelsohn). Dev-only tooling, not in the shipped bundle. \
Major migration tracked as a follow-up card. Re-check by the expiry date."""

