# Statische Auslieferung des Vite-Builds + SPA-Fallback fuer React-Router.
# Healthcheck-Endpunkt /healthz ist absichtlich kein index.html-Render,
# damit der Docker-Healthcheck nicht das ganze SPA-Bundle ausliefert.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nach dem OAuth-/E-Mail-Confirm-Redirect landet der Browser auf
    # `/auth/callback#...` — dabei werden (auf localhost shared) ggf. grosse
    # Cookies mitgesendet, die den nginx-Default-Header-Puffer (4x8k) sprengen
    # -> 400 "Request Header Or Cookie Too Large". Groessere Puffer.
    large_client_header_buffers 8 32k;
    client_header_buffer_size   16k;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html darf nie stale gecacht werden: alte Chunk-Referenzen
        # (Hash-Namen) laufen nach einem Deploy ins 404 („Importing a module
        # script failed"). no-cache = bei jedem Laden revalidieren (304 via
        # ETag bleibt billig), NICHT no-store.
        add_header Cache-Control "no-cache";
    }

    # Assets sind mit Hash im Namen versioniert — aggressiv cachen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
