# Statische Auslieferung des Vite-Builds + SPA-Fallback fuer React-Router,
# plus Same-Origin-Reverse-Proxy auf API und Auth.
#
# Warum der Proxy: die Ziel-URLs waren frueher zur Compile-Zeit ins Bundle
# gebacken (`VITE_API_BASE_URL=http://localhost:8000`) — von einem zweiten
# Geraet im LAN aus zeigte die App damit auf DESSEN localhost und war tot.
# Jetzt spricht der Browser ausschliesslich mit dem Origin, von dem er geladen
# wurde (`http://localhost:5173`, `http://<lan-ip>:5173`, eine Domain), und
# dieser nginx reicht `/v1/` und `/auth/v1/` intern weiter. Nebeneffekt: CORS
# entfaellt fuer den lokalen Betrieb komplett.
#
# Deployments mit getrennten Subdomains (Caddy: `app.` / `api.` / `mcp.`)
# setzen die URLs stattdessen per Runtime-Env (`WHO2BE_API_BASE_URL`, siehe
# docker/40-who2be-runtime-config.sh) — dann laeuft dieser Proxy einfach leer.
#
# Header-Politik unveraendert (F-12): Security-Header setzt zentral Caddy
# (deploy/hetzner/Caddyfile), nicht diese Datei.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nach dem OAuth-/E-Mail-Confirm-Redirect landet der Browser auf
    # `/auth/callback#...` — dabei werden (auf localhost shared) ggf. grosse
    # Cookies mitgesendet, die den nginx-Default-Header-Puffer (4x8k) sprengen
    # -> 400 "Request Header Or Cookie Too Large". Groessere Puffer.
    large_client_header_buffers 8 32k;
    client_header_buffer_size   16k;

    # WorkArea-Ingest laedt Dateien hoch; der nginx-Default (1m) waere die
    # engste Stelle der Kette und wuerde als 413 beim User landen.
    client_max_body_size 100m;

    # Dockers eingebetteter DNS. Ohne Variablen-`proxy_pass` (unten) resolved
    # nginx die Upstreams nur EINMAL beim Worker-Start und haengt nach einem
    # `compose up`-Recreate an der alten IP fest (502). Gleiche Begruendung wie
    # in supabase/gateway.conf. Faellt der Name gar nicht auf (Deployment ohne
    # diese Services), scheitert erst der Request — nicht der Start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html darf nie stale gecacht werden: alte Chunk-Referenzen
        # (Hash-Namen) laufen nach einem Deploy ins 404 („Importing a module
        # script failed"). no-cache = bei jedem Laden revalidieren (304 via
        # ETag bleibt billig), NICHT no-store.
        add_header Cache-Control "no-cache";
    }

    # Runtime-Konfiguration: wird beim Container-Start neu geschrieben und darf
    # deshalb nie aus dem Browser-Cache kommen (sonst spricht die App nach einem
    # Umzug weiter mit dem alten Host).
    location = /config.js {
        add_header Cache-Control "no-store";
        default_type application/javascript;
    }

    # Assets sind mit Hash im Namen versioniert — aggressiv cachen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Same-Origin-Proxy ---------------------------------------------------
    # REST-API. Kollidiert nicht mit dem SPA-Router: dessen Routen liegen unter
    # /w/…, /settings/…, /oauth/… — kein /v1-Prefix.
    location /v1/ {
        set $who2be_api "http://api:8000";
        proxy_pass $who2be_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exporte und grosse Listen sollen fliessen statt erst komplett im
        # nginx zu landen.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # GoTrue ueber den Auth-Gateway (der strippt `/auth/v1` und beantwortet den
    # Preflight). Same-Origin macht den Preflight hier zwar gegenstandslos, der
    # Gateway bleibt aber der eine Ort, der GoTrue-Eigenheiten kennt.
    location /auth/v1/ {
        set $who2be_auth "http://auth-gateway:9999";
        proxy_pass $who2be_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP-Server (Streamable HTTP, ADR-0034). `^~` schlaegt den SPA-Fallback:
    # ohne diesen Block liefert `/mcp` das index.html mit 200, und ein
    # MCP-Client sieht HTML statt eines sauberen 401. Deckt auch die
    # agent-spezifischen Connector-Pfade `/mcp/a/{uuid}` ab (Issue #404).
    location ^~ /mcp {
        set $who2be_mcp "http://mcp:8765";
        proxy_pass $who2be_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamable HTTP haelt eine SSE-Verbindung offen: Puffern wuerde die
        # Events zurueckhalten, ein kurzes Read-Timeout sie abschneiden.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Protected-Resource-Metadata (RFC 9728) liegt NICHT unter /mcp, sondern
    # unter /.well-known/oauth-protected-resource/mcp — der 401 des MCP-Servers
    # verweist per `WWW-Authenticate` genau dorthin.
    location ^~ /.well-known/oauth-protected-resource {
        set $who2be_mcp_prm "http://mcp:8765";
        proxy_pass $who2be_mcp_prm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
