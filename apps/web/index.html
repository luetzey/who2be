<!doctype html>
<!-- lang="de": Startwert vor dem JS-Load, identisch zu DEFAULT_LOCALE/fallbackLng
     in src/i18n/index.ts. Wird nach dem i18next-Init und bei jedem Sprachwechsel
     auf die aktive Sprache synchronisiert (siehe dort). -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nicht indexieren: zweite Linie hinter dem X-Robots-Tag-Header aus
         deploy/hetzner/Caddyfile, fuer Deployments ohne diese Caddyfile
         (Dokploy/Traefik, Self-Hosting). robots.txt sperrt bewusst nichts,
         sonst sieht ein Crawler dieses Tag nie (public/robots.txt). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Who2Be</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime-Konfiguration (src/config.ts): im Container vom
         nginx-Entrypoint aus Env geschrieben, im Dev-Server der leere
         Platzhalter aus public/. MUSS vor dem App-Bundle laden. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
