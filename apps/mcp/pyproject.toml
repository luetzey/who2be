[project]
name = "who2be-mcp"
version = "0.1.0"
description = "Who2Be FastMCP server"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "who2be-models",
]

[tool.uv.sources]
who2be-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/who2be_mcp"]
