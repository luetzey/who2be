[project]
name = "who2be-mcp"
version = "0.1.0"
description = "Who2Be FastMCP server"
requires-python = ">=3.11"
license = { text = "FSL-1.1-Apache-2.0" }
authors = [{ name = "Yannick Lützenburg", email = "luetzey@gmail.com" }]
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "pydantic-settings>=2.15.0",
    "structlog>=24.1",
    "who2be-models",
]

[tool.uv.sources]
who2be-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/who2be_mcp"]
