[project]
name = "who2be-api"
version = "0.1.0"
description = "Who2Be FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "who2be-models",
]

[tool.uv.sources]
who2be-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/who2be_api"]
