[project]
name = "who2be-api"
version = "0.1.0"
description = "Who2Be FastAPI backend"
requires-python = ">=3.11"
license = { text = "FSL-1.1-Apache-2.0" }
authors = [{ name = "Yannick Lützenburg", email = "luetzey@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    # WorkArea-Ingest (ADR-0048, Pipeline B): HTML-Extraktion serverseitig,
    # bevor irgendetwas persistiert wird (HTML ist nie Quellformat).
    "beautifulsoup4>=4.12",
    "cryptography>=44",
    "httpx>=0.28",
    # Pluggable Rate-Limit-Storage (Plan CL2): `limits` liefert die Moving-Window-
    # Strategie + Storage-Backends, `redis` den Client fuer `redis://`-URIs. `limits`
    # ist transitiv via slowapi vorhanden, hier explizit gepinnt, weil der Code es
    # direkt importiert; `redis` wird erst beim redis://-Pfad geladen.
    "limits>=3.0",
    "markdown-it-py>=3.0",
    # BlobStore (ADR-0048): S3-kompatibler Objekt-Storage fuer den WorkArea-Ingest.
    # Das SDK ist Apache-2.0 und Kern-Dependency; der AGPL-MinIO-SERVER laeuft nur
    # als Container (docker-compose: `minio`), wie Postgres.
    "minio>=7.2",
    # XLSX-Export der WorkArea-Tabellen (ADR-0049): openpyxl schreibt die
    # Arbeitsmappe rein in memory. MIT-Lizenz (wie et-xmlfile, die einzige
    # transitive Abhaengigkeit) — Lizenz-Gate-konform (ADR-0033).
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    # WorkArea-Ingest (ADR-0048): PDF-Text-Extraktion in memory, VOR jedem Write.
    "pypdf>=5",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "structlog>=24.1",
    "who2be-models",
]

[project.scripts]
who2be-migrate = "who2be_api.core.migrations:cli"
who2be-retrieval-backfill = "who2be_api.core.chunk_backfill:cli"
who2be-purge = "who2be_api.core.purge:cli"
who2be-license = "who2be_api.core.license_cli:cli"

[tool.uv.sources]
who2be-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/who2be_api"]
