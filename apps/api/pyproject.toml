[project]
name = "who2be-api"
version = "0.1.0"
description = "Who2Be FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "markdown-it-py>=3.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
    "structlog>=24.1",
    "who2be-models",
]

[project.scripts]
who2be-migrate = "who2be_api.core.migrations:cli"

[tool.uv.sources]
who2be-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/who2be_api"]
