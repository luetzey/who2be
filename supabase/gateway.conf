# Minimaler Supabase-API-Gateway-Ersatz fuer den lokalen Stack.
# supabase-js spricht `${supabaseUrl}/auth/v1/*`; GoTrue servt aber unter `/`.
# Dieser Reverse-Proxy strippt den Prefix. MS-2 ersetzt das durch Kong.
server {
    listen 9999;
    server_name _;

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://auth:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
