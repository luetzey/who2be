# Minimaler Supabase-API-Gateway-Ersatz fuer den lokalen Stack.
# supabase-js spricht `${supabaseUrl}/auth/v1/*`; GoTrue servt aber unter `/`.
# Dieser Reverse-Proxy strippt den Prefix UND beantwortet den CORS-Preflight
# selbst — GoTrue ignoriert OPTIONS sonst (kein ACAO/ACAM/ACAH), das war
# bislang die Ursache fuer "Failed to fetch" beim Web-Login. MS-2 ersetzt
# das durch Kong.
server {
    listen 9999;
    server_name _;

    # OAuth-Callback (Google/GitHub) bringt eine grosse state/code-Query, dazu
    # haengt der Browser angesammelte localhost-Cookies an — das sprengt nginx'
    # Default-Header-Puffer (4x8k) und liefert 400 "Request Header Or Cookie Too
    # Large". Groessere Puffer fuer den Auth-Callback.
    large_client_header_buffers 8 32k;
    client_header_buffer_size   16k;

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /auth/v1/ {
        # CORS-Preflight: hier komplett beantworten.
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'authorization, apikey, content-type, x-client-info, x-supabase-api-version' always;
            add_header 'Access-Control-Max-Age' '1728000' always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' '0';
            return 204;
        }

        # GoTrue setzt auf POST/GET selbst ACAO=* — doppelt waere ein
        # Browser-Error ("Access-Control-Allow-Origin contains multiple
        # values"), und ACAO=* schliesst Allow-Credentials=true zudem aus.
        # Daher GoTrues Header wegnehmen und unsere passenden setzen.
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'X-Total-Count, Link, X-Supabase-Api-Version' always;

        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://auth:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
