# Lokale Entwicklungs-Infrastruktur fuer Who2Be.
# `docker compose up -d --wait` faehrt den ganzen Stack hoch:
#   db (Postgres) -> migrate (einmalig) -> auth (GoTrue) + api -> web.
# Gegenstueck: docs/local-smoke.md (1-Befehl-Variante) + scripts/smoke.sh.
# Vorgriff auf MS-2 C1-C6: self-hosted GoTrue ersetzt die Supabase-Cloud-
# Abhaengigkeit fuer den lokalen Smoke. Kong/Studio/PostgREST bleiben fuer
# MS-2 separat (siehe `## Offene Punkte` im Plan).
services:
  db:
    # pgvector-Variante statt `postgres:16` (ADR-0046): die semantische Suche
    # braucht die `vector`-Extension, die das Basis-Image nicht mitbringt.
    # Prod (supabase/postgres) hat sie bereits.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: who2be
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d who2be"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_BUILD_TARGET:-runtime}
    command: ["who2be-migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/who2be
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  auth:
    image: supabase/gotrue:v2.158.1
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/who2be?search_path=auth
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173,http://localhost:5173/*
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # MFA / TOTP (WP-F, Befund S1): Zwei-Faktor per TOTP. Nach einer
      # verifizierten Challenge setzt GoTrue den JWT-Claim `aal=aal2`; die API
      # erzwingt aal2 fuer Admin-Aktionen (core/security.require_aal2). GoTrue
      # v2.158.1 kennt KEIN Top-Level GOTRUE_MFA_ENABLED — Faktoren werden pro
      # Typ geschaltet (TOTP default an; hier explizit + via .env overridebar).
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: ${GOTRUE_MFA_TOTP_ENROLL_ENABLED:-true}
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: ${GOTRUE_MFA_TOTP_VERIFY_ENABLED:-true}
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: ${GOTRUE_MFA_MAX_ENROLLED_FACTORS:-10}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Dev bleibt autoconfirm: kein SMTP noetig, Signups sind sofort nutzbar.
      # Prod (deploy/hetzner) schaltet das auf false + echten Mailer um.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Social-Login (Track K) — lokal default AUS. Zum Testen die Werte in
      # .env setzen (GOTRUE_EXTERNAL_GOOGLE_ENABLED=true + CLIENT_ID/SECRET).
      # Die Provider rufen nach dem Login die GoTrue-Callback-Route ueber den
      # auth-gateway auf (/auth/v1/callback → intern /callback).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-http://localhost:9999/auth/v1/callback}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI:-http://localhost:9999/auth/v1/callback}
      API_EXTERNAL_URL: http://localhost:9999
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./supabase/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 statt localhost — nginx-alpine hoert nur IPv4 (kein
      # IPv6-Listener), `localhost` aufloest in der Image-Default zu ::1.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # On-Prem (Default, ohne Billing). Cloud-Dev: API_BUILD_TARGET=runtime-cloud.
      target: ${API_BUILD_TARGET:-runtime}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/who2be
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
      CORS_ORIGINS: http://localhost:5173
      # Edition + Mollie-Pull-Billing (Plan §3.2) — alle leer/onprem im lokalen
      # Stack; nur die Cloud-Edition mit gesetztem MOLLIE_API_KEY schaltet Billing scharf.
      WHO2BE_EDITION: ${WHO2BE_EDITION:-onprem}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_WEBHOOK_SECRET: ${MOLLIE_WEBHOOK_SECRET:-}
      MOLLIE_WEBHOOK_URL: ${MOLLIE_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Vite braucht die VITE_*-Werte zur Compile-Zeit; sie muessen
      # daher Build-Args sein (apps/web/Dockerfile:14-21). Das frueher
      # genutzte `environment:` wirkte zur Runtime und war fuer den
      # nginx-Multi-Stage-Build wirkungslos.
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_SUPABASE_URL: http://localhost:9999
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-dev-anon-key-not-used-by-gotrue}
        # On-Prem (Default) → Billing-UI wird aus dem Bundle tree-shaked.
        # Cloud-Dev: VITE_WHO2BE_EDITION=cloud setzen.
        VITE_WHO2BE_EDITION: ${VITE_WHO2BE_EDITION:-onprem}
    ports:
      # Container hoert mit nginx auf 80; Host-Port bleibt 5173, damit
      # smoke.sh + CORS-Origin unveraendert bleiben.
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
