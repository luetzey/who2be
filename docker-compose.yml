# Lokale Entwicklungs-Infrastruktur fuer Who2Be.
# `docker compose up -d --wait` faehrt den ganzen Stack hoch:
#   db (Postgres) -> migrate (einmalig) -> auth (GoTrue) + api -> web.
#
# Laeuft OHNE `.env`: jeder Wert unten hat einen Compose-Default. Fuer den
# Zugriff von einem anderen Geraet im Netz genuegt EINE Variable:
#   WHO2BE_PUBLIC_URL=http://<host-ip>:5173 docker compose up -d --wait
# Sie steuert CORS, die GoTrue-Redirect-Allowlist und die Invitation-Links.
# Die Web-App selbst braucht sie nicht — ihr Bundle spricht Same-Origin
# (apps/web/nginx.conf proxied /v1/ und /auth/v1/).
# Gegenstueck: docs/local-smoke.md (1-Befehl-Variante) + scripts/smoke.sh.
# Vorgriff auf MS-2 C1-C6: self-hosted GoTrue ersetzt die Supabase-Cloud-
# Abhaengigkeit fuer den lokalen Smoke. Kong/Studio/PostgREST bleiben fuer
# MS-2 separat (siehe `## Offene Punkte` im Plan).

# Ein Build, zwei Verwender: der API-Service und der One-Shot
# `blobstore-bootstrap` fahren dasselbe Artefakt (letzterer nur wegen des
# darin enthaltenen Apache-2.0-SDKs `minio`, das S3 spricht). Bewusst ein
# Anchor statt zweier gleich aussehender `build:`-Bloecke — `target` ist
# variabel, und zwei Kopien wuerden beim naechsten Target-Wechsel
# auseinanderlaufen.
x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  # On-Prem (Default, ohne Billing). Cloud-Dev: API_BUILD_TARGET=runtime-cloud.
  target: ${API_BUILD_TARGET:-runtime}

services:
  db:
    # pgvector-Variante statt `postgres:16` (ADR-0046): die semantische Suche
    # braucht die `vector`-Extension, die das Basis-Image nicht mitbringt.
    # Prod (supabase/postgres) hat sie bereits.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: who2be
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d who2be"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_BUILD_TARGET:-runtime}
    command: ["who2be-migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/who2be
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  auth:
    image: supabase/gotrue:v2.196.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/who2be?search_path=auth
      # Basis-URL der Web-App. WHO2BE_PUBLIC_URL setzen, wenn der Stack ueber
      # eine LAN-IP oder einen Hostnamen aufgerufen wird — sonst weist GoTrue
      # Magic-Link-/Invitation-/OAuth-Redirects auf diese Adresse ab.
      GOTRUE_SITE_URL: ${WHO2BE_PUBLIC_URL:-http://localhost:5173}
      GOTRUE_URI_ALLOW_LIST: ${WHO2BE_PUBLIC_URL:-http://localhost:5173},${WHO2BE_PUBLIC_URL:-http://localhost:5173}/*
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # MFA (WP-F, Befund S1; WebAuthn seit #499): Zwei-Faktor per TOTP oder
      # WebAuthn. Nach einer verifizierten Challenge setzt GoTrue den JWT-Claim
      # `aal=aal2`; die API erzwingt aal2 fuer Admin-Aktionen
      # (core/security.require_aal2). GoTrue kennt KEIN Top-Level
      # GOTRUE_MFA_ENABLED — Faktoren werden pro Typ geschaltet. TOTP ist per
      # Default an, WebAuthn per Default AUS (MFAFactorTypeConfiguration traegt
      # `default:"false"` fuer beide Schalter, TOTP hat einen eigenen Typ mit
      # `default:"true"`) — deshalb stehen beide WebAuthn-Schalter explizit hier.
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: ${GOTRUE_MFA_TOTP_ENROLL_ENABLED:-true}
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: ${GOTRUE_MFA_TOTP_VERIFY_ENABLED:-true}
      GOTRUE_MFA_WEB_AUTHN_ENROLL_ENABLED: ${GOTRUE_MFA_WEB_AUTHN_ENROLL_ENABLED:-true}
      GOTRUE_MFA_WEB_AUTHN_VERIFY_ENABLED: ${GOTRUE_MFA_WEB_AUTHN_VERIFY_ENABLED:-true}
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: ${GOTRUE_MFA_MAX_ENROLLED_FACTORS:-10}
      # WebAuthn-Relying-Party (ANDERES Praefix als die Faktor-Schalter oben:
      # GOTRUE_WEBAUTHN_*, nicht GOTRUE_MFA_WEB_AUTHN_*). Alle drei sind
      # Pflicht, sobald ein WebAuthn-Schalter an ist; seit v2.190.0 warnt GoTrue
      # bei unvollstaendiger Konfiguration, statt den Start abzubrechen.
      # RP_ID ist die registrierbare Domain OHNE Schema und Port (lokal
      # `localhost`); RP_ORIGINS ist der vollstaendige Origin MIT Schema/Port
      # und folgt derselben Quelle wie GOTRUE_SITE_URL oben.
      # ACHTUNG, die beiden muessen zusammenpassen: RP_ORIGINS kommt aus
      # WHO2BE_PUBLIC_URL, RP_ID faellt unabhaengig davon auf `localhost`
      # zurueck. Wer den Stack ueber eine LAN-IP oder einen Hostnamen faehrt,
      # setzt GOTRUE_WEBAUTHN_RP_ID in .env passend dazu — sonst lehnt der
      # Browser die Registrierung ab (siehe .env.example).
      GOTRUE_WEBAUTHN_RP_ID: ${GOTRUE_WEBAUTHN_RP_ID:-localhost}
      GOTRUE_WEBAUTHN_RP_DISPLAY_NAME: ${GOTRUE_WEBAUTHN_RP_DISPLAY_NAME:-Who2Be}
      GOTRUE_WEBAUTHN_RP_ORIGINS: ${WHO2BE_PUBLIC_URL:-http://localhost:5173}
      # E-Mail/Passwort als Auth-Provider — dev/On-Prem: an. Das Cloud-Overlay
      # (docker-compose.cloud.yml) setzt `false`: dort meldet man sich nur ueber
      # externe Provider an (Owner-Entscheidung 2026-09-24). Web-Pendant ist das
      # Build-Arg VITE_WHO2BE_EDITION (ADR-0029).
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      # Dev bleibt autoconfirm: kein SMTP noetig, Signups sind sofort nutzbar.
      # Prod (deploy/hetzner) schaltet das auf false + echten Mailer um.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Social-Login (Track K) — lokal default AUS. Zum Testen die Werte in
      # .env setzen (GOTRUE_EXTERNAL_GOOGLE_ENABLED=true + CLIENT_ID/SECRET).
      # Die Provider rufen nach dem Login die GoTrue-Callback-Route ueber den
      # auth-gateway auf (/auth/v1/callback → intern /callback).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-http://localhost:9999/auth/v1/callback}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI:-http://localhost:9999/auth/v1/callback}
      # Sign in with Apple — lokal NICHT testbar: Apple lehnt `localhost` und
      # IP-Adressen als Redirect-URI ab und verlangt HTTPS mit einer im
      # Apple-Portal registrierten Domain (developer.apple.com,
      # "Configuring your webpage for Sign in with Apple"). Die Default-URI hier
      # ist deshalb nur ein Platzhalter fuer die Form; wer Apple lokal probieren
      # will, braucht einen oeffentlichen HTTPS-Tunnel (wie beim Mollie-Webhook)
      # und muss dessen Domain im Portal eintragen.
      #
      # ACHTUNG, anders als bei Google/GitHub: GOTRUE_EXTERNAL_APPLE_SECRET ist
      # kein statischer String, sondern ein aus dem `.p8`-Key signiertes
      # ES256-JWT mit HOECHSTENS SECHS MONATEN Laufzeit. GoTrue erneuert es
      # nicht und warnt nicht; nach Ablauf antwortet Apple `invalid_client` und
      # der Login scheitert mit einer generischen 500. Erneuerungs-Prozedur:
      # deploy/hetzner/supabase/README.md.
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${GOTRUE_EXTERNAL_APPLE_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${GOTRUE_EXTERNAL_APPLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${GOTRUE_EXTERNAL_APPLE_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_APPLE_REDIRECT_URI:-http://localhost:9999/auth/v1/callback}
      API_EXTERNAL_URL: http://localhost:9999
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./supabase/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # Schreibt /etc/nginx/resolver.conf beim Start aus der DNS-Adresse des
      # Containers — gateway.conf includiert sie. Ohne diesen Mount fehlt die
      # Datei und nginx startet nicht. Unter Docker ist das Ergebnis
      # `127.0.0.11` wie zuvor, unter rootless Podman die dort gueltige Adresse
      # (fest verdrahtet lief jeder Signup stumm in ein 502).
      - ./docker/10-who2be-nginx-resolver.sh:/docker-entrypoint.d/10-who2be-nginx-resolver.sh:ro
    ports:
      - "9999:9999"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 statt localhost — nginx-alpine hoert nur IPv4 (kein
      # IPv6-Listener), `localhost` aufloest in der Image-Default zu ::1.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: *api-build
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/who2be
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
      # Same-Origin (Browser → web-nginx → api) braucht kein CORS; die Liste
      # deckt den DIREKTEN Zugriff auf :8000 ab (curl, zweiter Dev-Server).
      CORS_ORIGINS: ${WHO2BE_PUBLIC_URL:-http://localhost:5173}
      # Basis fuer Invitation-Links ({WEB_BASE_URL}/invitations/{token}/accept).
      WEB_BASE_URL: ${WHO2BE_PUBLIC_URL:-http://localhost:5173}
      # Edition + Mollie-Pull-Billing (Plan §3.2) — alle leer/onprem im lokalen
      # Stack; nur die Cloud-Edition mit gesetztem MOLLIE_API_KEY schaltet Billing scharf.
      WHO2BE_EDITION: ${WHO2BE_EDITION:-onprem}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_WEBHOOK_SECRET: ${MOLLIE_WEBHOOK_SECRET:-}
      MOLLIE_WEBHOOK_URL: ${MOLLIE_WEBHOOK_URL:-}
      # Tabellen-Store (ADR-0049): eine SQLite-Datei pro WorkArea unter
      # {workspace_id}/{area_id}.sqlite — die Datei ist die Isolationsgrenze,
      # read-only erzwingt die Engine (query_only + Authorizer). Persistiert
      # im Volume tablestore-data, damit Area-Tabellen Neustarts ueberleben.
      WHO2BE_TABLESTORE_DIR: /data/tablestore
    volumes:
      - tablestore-data:/data/tablestore
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # `docker compose up --wait` toleriert beendete One-Shots nur, wenn ein
      # Dienst per service_completed_successfully von ihnen abhaengt (sonst
      # Exit 1 trotz erfolgreichem Lauf) — gleiches Muster wie bei `migrate`.
      blobstore-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # KEINE VITE_API_BASE_URL/VITE_SUPABASE_URL mehr: die waeren
        # Compile-Time einbetoniert und haetten das Image an `localhost`
        # gebunden. Die App loest ihre URLs zur Laufzeit auf (/config.js →
        # Same-Origin, siehe apps/web/src/config.ts).
        # On-Prem (Default) → Billing-UI wird aus dem Bundle tree-shaked.
        # Cloud-Dev: VITE_WHO2BE_EDITION=cloud setzen.
        VITE_WHO2BE_EDITION: ${VITE_WHO2BE_EDITION:-onprem}
    environment:
      # Leer = Same-Origin (der nginx dieses Containers proxied /v1/ und
      # /auth/v1/). Nur setzen, wenn API/Auth unter eigenen Hosts liegen —
      # z. B. WHO2BE_API_BASE_URL=https://api.example.com.
      WHO2BE_API_BASE_URL: ${WHO2BE_API_BASE_URL:-}
      WHO2BE_SUPABASE_URL: ${WHO2BE_SUPABASE_URL:-}
      WHO2BE_SUPABASE_ANON_KEY: ${WHO2BE_SUPABASE_ANON_KEY:-}
      # MCP-Endpoint fuer die Copy-Config in der UI. Explizit gesetzt, weil die
      # Ableitung aus der API-Basis (api.→mcp.) same-origin auf `/mcp` zeigen
      # wuerde — und der SPA-Fallback dort HTML statt MCP liefert.
      WHO2BE_MCP_URL: ${WHO2BE_MCP_URL:-http://localhost:8765/mcp}
      WHO2BE_SIGNUP_DISABLED: ${WHO2BE_SIGNUP_DISABLED:-false}
      # "Wir arbeiten noch"-Modus (#429). Muss hier durchgereicht werden, sonst
      # sieht der Entrypoint den Wert nie und `/config.js` bleibt auf "open".
      # GOTRUE_DISABLE_SIGNUP wird davon NICHT abgeleitet (Compose kann keine
      # Variable aus einer anderen berechnen) — beide gemeinsam setzen.
      WHO2BE_LAUNCH_MODE: ${WHO2BE_LAUNCH_MODE:-open}
      WHO2BE_LAUNCH_CONTACT: ${WHO2BE_LAUNCH_CONTACT:-}
      # Absolute Obergrenze der "Angemeldet bleiben"-Sitzung in Stunden
      # (#430/#470, ADR-0052). Gueltig ist 1-24; die Web-App faellt bei
      # fehlendem/ungueltigem Wert fail-closed auf 12 zurueck. Muss wie
      # WHO2BE_LAUNCH_MODE durchgereicht werden, sonst sieht der Entrypoint
      # den Wert nie und /config.js bleibt still auf dem Default.
      WHO2BE_SESSION_MAX_AGE_HOURS: ${WHO2BE_SESSION_MAX_AGE_HOURS:-12}
      # Turnstile-Site-Key fuer das Captcha an den Auth-Masken (#539). LEER =
      # kein Widget, Auth laeuft exakt wie bisher. Gehoert paarweise zu
      # GOTRUE_SECURITY_CAPTCHA_* am auth-Service: Site-Key hier (oeffentlich,
      # steht im HTML), Secret dort (nie in die Web-App). Nur eine der beiden
      # Seiten zu setzen bricht den Signup — entweder beide oder keine.
      WHO2BE_TURNSTILE_SITE_KEY: ${WHO2BE_TURNSTILE_SITE_KEY:-}
    ports:
      # Container hoert mit nginx auf 80; Host-Port bleibt 5173, damit
      # smoke.sh + CORS-Origin unveraendert bleiben.
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
      # Der /auth/v1-Proxy zeigt auf den Gateway — ohne ihn liefe der Login
      # beim ersten Aufruf ins 502.
      auth-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MCP-Server im Streamable-HTTP-Transport (ADR-0034). Ohne ihn waere der
  # Kern von Who2Be lokal nur ueber `uv run python -m who2be_mcp.server`
  # erreichbar — also genau die Python-Toolchain, die der Ein-Befehl-Start
  # abschafft. Auth: ein normaler `w2b_`-Token als Bearer, den der Server per
  # GET /v1/me gegen die API verifiziert (apps/mcp/.../auth.py) — kein
  # OAuth-Tanz noetig. Token in der Web-UI unter Einstellungen → Tokens.
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    environment:
      WHO2BE_API_BASE_URL: http://api:8000
      WHO2BE_TRANSPORT: http
      WHO2BE_HTTP_HOST: 0.0.0.0
      WHO2BE_HTTP_PORT: "8765"
      WHO2BE_HTTP_PATH: /mcp
      WHO2BE_LOG_FORMAT: ${WHO2BE_MCP_LOG_FORMAT:-console}
      # Oeffentliche Adressen fuer die OAuth-Discovery (RFC 9728): der Server
      # advertisiert `{MCP_PUBLIC_URL}{HTTP_PATH}` als Resource, und die muss
      # mit MCP_RESOURCE_URL der API uebereinstimmen (Default dort:
      # http://127.0.0.1:8765/mcp). Fuer den Token-Weg spielt das keine Rolle.
      WHO2BE_OAUTH_ISSUER_URL: ${WHO2BE_OAUTH_ISSUER_URL:-http://localhost:8000}
      WHO2BE_MCP_PUBLIC_URL: ${WHO2BE_MCP_PUBLIC_URL:-http://localhost:8765}
    ports:
      - "8765:8765"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # TCP-Connect statt HTTP: der Streamable-HTTP-Endpunkt antwortet ohne
      # Token mit 401 und ohne Session-Id mit 400 — beides waere fuer curl ein
      # Fehler. Der Check im Dockerfile macht dasselbe; hier explizit, damit
      # `--wait` ihn sicher nutzt.
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8765)); s.close()"
      interval: 5s
      timeout: 5s
      retries: 10

  # Content-addressed Blob-Storage fuer den WorkArea-Ingest (ADR-0048).
  # SeaweedFS (Apache-2.0) statt MinIO (#525): MinIOs Community-Edition ist
  # eingestellt, das Image von Docker Hub verschwunden, und AGPL faellt unter
  # die Deny-Liste aus ADR-0033. Der Anwendungscode bleibt unberuehrt — die App
  # spricht S3 ueber das Apache-2.0-SDK `minio`, nicht MinIO-Protokoll, und der
  # BlobStore-Port (ADR-0048) wurde genau fuer diesen Tausch eingefuehrt.
  # Keys: blobs/{workspace}/{sha256}.
  # Ohne WHO2BE_BLOBSTORE_*-Env in der API bleibt der Dienst ungenutzt —
  # nur Ingest/Blob-Reads liefern dann 503, alles andere laeuft.
  seaweedfs:
    # Digest-gepinnt statt nur Tag — Objekt-Storage-Daten sollen nicht an einem
    # impliziten Image-Sprung haengen.
    image: chrislusf/seaweedfs:4.22@sha256:84429e5f21fad82246f5cfae7b39e9a17da18afb62f2b79c25ccd364ab02793b
    # All-in-One (`server`) statt des Vier-Service-Stacks master/volume/filer/s3
    # aus SeaweedFS' eigener Compose-Vorlage: fuer EINEN Bucket waeren vier
    # Container ein schlechter Tausch gegen den einen MinIO-Container.
    #
    # `-s3.config` ist ein Sicherheits-Gate, keine Kuer. Doku woertlich: „By
    # default, if no credentials are configured, SeaweedFS allows anonymous
    # access to all S3 operations." Ohne die Datei staende der Store offen.
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    ports:
      # Nur Loopback binden (Security-Review 2026-08-13 L3): der Dev-Store
      # laeuft mit den Default-Credentials aus scripts/seaweedfs-s3.json — er
      # darf nie im LAN erreichbar sein. Prod setzt eigene Keys (s3.json +
      # SEAWEEDFS_S3_*) und exponiert nur ueber Caddy/internes Netz.
      - "127.0.0.1:8333:8333"  # S3-API (WHO2BE_BLOBSTORE_ENDPOINT=localhost:8333)
      - "127.0.0.1:9333:9333"  # Master-HTTP (Status-Seite + Healthcheck)
      # Volume (8080) und Filer (8888) startet `server` mit, bleiben aber
      # bewusst unveroeffentlicht — die App braucht nur S3.
    volumes:
      - seaweedfs-data:/data
      # Statische Identitaet per Mount, Muster `set-app-role-password`
      # (docker-compose.cloud.yml). Docker substituiert in gemounteten Dateien
      # NICHTS: wer die Keys aendert, muss scripts/seaweedfs-s3.json UND
      # SEAWEEDFS_S3_ACCESS_KEY/-SECRET_KEY aendern, sonst laeuft der Bootstrap
      # in ein 403.
      - ./scripts/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # NICHT `8333/healthz`: der S3-Handler liest den Pfad als Bucket-Namen
      # und antwortet 404 (seaweedfs#8243) — der Stack bliebe ewig unhealthy.
      # Der Master-Port hat einen echten Status-Endpunkt.
      # `wget` statt `curl`: das Image ist alpine-basiert, busybox bringt wget
      # immer mit, curl nicht zwingend. 127.0.0.1 statt `localhost` aus dem
      # gleichen Grund wie beim auth-gateway oben (IPv6-::1 ohne Listener).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-Shot (Muster `set-app-role-password`, docker-compose.cloud.yml): legt
  # den Bucket `who2be-blobs` idempotent an und terminiert. Die App erstellt
  # Buckets bewusst nie selbst (ADR-0048) — diese Trennung bleibt, gewechselt
  # hat nur der Server dahinter.
  #
  # Faehrt das API-Image statt eines eigenen CLI-Images: das Apache-2.0-SDK
  # `minio` ist dort ohnehin Kern-Dependency (ADR-0048) und spricht S3, also
  # braucht die Bucket-Anlage kein zweites Image in der Lieferkette.
  blobstore-bootstrap:
    build: *api-build
    entrypoint: ["python", "/scripts/blobstore-bootstrap.py"]
    environment:
      BLOBSTORE_ENDPOINT: seaweedfs:8333
      BLOBSTORE_BUCKET: who2be-blobs
      # Muessen zu scripts/seaweedfs-s3.json passen (s. Mount-Kommentar oben).
      BLOBSTORE_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:-who2be-dev}
      BLOBSTORE_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:-who2be-dev-secret}
    volumes:
      # Skript per Mount statt im Image — Muster `set-app-role-password`.
      - ./scripts/blobstore-bootstrap.py:/scripts/blobstore-bootstrap.py:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  seaweedfs-data:
  # SQLite-Dateien des Tabellen-Stores (ADR-0049), eine pro WorkArea.
  tablestore-data:
