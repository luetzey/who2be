# Lokale Entwicklungs-Infrastruktur fuer Who2Be.
# `docker compose up -d --wait` faehrt den ganzen Stack hoch:
#   db (Postgres) -> migrate (einmalig) -> auth (GoTrue) + api -> web.
#
# Laeuft OHNE `.env`: jeder Wert unten hat einen Compose-Default. Fuer den
# Zugriff von einem anderen Geraet im Netz genuegt EINE Variable:
#   WHO2BE_PUBLIC_URL=http://<host-ip>:5173 docker compose up -d --wait
# Sie steuert CORS, die GoTrue-Redirect-Allowlist und die Invitation-Links.
# Die Web-App selbst braucht sie nicht — ihr Bundle spricht Same-Origin
# (apps/web/nginx.conf proxied /v1/ und /auth/v1/).
# Gegenstueck: docs/local-smoke.md (1-Befehl-Variante) + scripts/smoke.sh.
# Vorgriff auf MS-2 C1-C6: self-hosted GoTrue ersetzt die Supabase-Cloud-
# Abhaengigkeit fuer den lokalen Smoke. Kong/Studio/PostgREST bleiben fuer
# MS-2 separat (siehe `## Offene Punkte` im Plan).
services:
  db:
    # pgvector-Variante statt `postgres:16` (ADR-0046): die semantische Suche
    # braucht die `vector`-Extension, die das Basis-Image nicht mitbringt.
    # Prod (supabase/postgres) hat sie bereits.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: who2be
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d who2be"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: ${API_BUILD_TARGET:-runtime}
    command: ["who2be-migrate"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/who2be
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  auth:
    image: supabase/gotrue:v2.158.1
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/who2be?search_path=auth
      # Basis-URL der Web-App. WHO2BE_PUBLIC_URL setzen, wenn der Stack ueber
      # eine LAN-IP oder einen Hostnamen aufgerufen wird — sonst weist GoTrue
      # Magic-Link-/Invitation-/OAuth-Redirects auf diese Adresse ab.
      GOTRUE_SITE_URL: ${WHO2BE_PUBLIC_URL:-http://localhost:5173}
      GOTRUE_URI_ALLOW_LIST: ${WHO2BE_PUBLIC_URL:-http://localhost:5173},${WHO2BE_PUBLIC_URL:-http://localhost:5173}/*
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # MFA / TOTP (WP-F, Befund S1): Zwei-Faktor per TOTP. Nach einer
      # verifizierten Challenge setzt GoTrue den JWT-Claim `aal=aal2`; die API
      # erzwingt aal2 fuer Admin-Aktionen (core/security.require_aal2). GoTrue
      # v2.158.1 kennt KEIN Top-Level GOTRUE_MFA_ENABLED — Faktoren werden pro
      # Typ geschaltet (TOTP default an; hier explizit + via .env overridebar).
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: ${GOTRUE_MFA_TOTP_ENROLL_ENABLED:-true}
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: ${GOTRUE_MFA_TOTP_VERIFY_ENABLED:-true}
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: ${GOTRUE_MFA_MAX_ENROLLED_FACTORS:-10}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Dev bleibt autoconfirm: kein SMTP noetig, Signups sind sofort nutzbar.
      # Prod (deploy/hetzner) schaltet das auf false + echten Mailer um.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Social-Login (Track K) — lokal default AUS. Zum Testen die Werte in
      # .env setzen (GOTRUE_EXTERNAL_GOOGLE_ENABLED=true + CLIENT_ID/SECRET).
      # Die Provider rufen nach dem Login die GoTrue-Callback-Route ueber den
      # auth-gateway auf (/auth/v1/callback → intern /callback).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-http://localhost:9999/auth/v1/callback}
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GOTRUE_EXTERNAL_GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GOTRUE_EXTERNAL_GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GOTRUE_EXTERNAL_GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI:-http://localhost:9999/auth/v1/callback}
      API_EXTERNAL_URL: http://localhost:9999
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./supabase/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 statt localhost — nginx-alpine hoert nur IPv4 (kein
      # IPv6-Listener), `localhost` aufloest in der Image-Default zu ::1.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # On-Prem (Default, ohne Billing). Cloud-Dev: API_BUILD_TARGET=runtime-cloud.
      target: ${API_BUILD_TARGET:-runtime}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/who2be
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32chars-min}
      # Same-Origin (Browser → web-nginx → api) braucht kein CORS; die Liste
      # deckt den DIREKTEN Zugriff auf :8000 ab (curl, zweiter Dev-Server).
      CORS_ORIGINS: ${WHO2BE_PUBLIC_URL:-http://localhost:5173}
      # Basis fuer Invitation-Links ({WEB_BASE_URL}/invitations/{token}/accept).
      WEB_BASE_URL: ${WHO2BE_PUBLIC_URL:-http://localhost:5173}
      # Edition + Mollie-Pull-Billing (Plan §3.2) — alle leer/onprem im lokalen
      # Stack; nur die Cloud-Edition mit gesetztem MOLLIE_API_KEY schaltet Billing scharf.
      WHO2BE_EDITION: ${WHO2BE_EDITION:-onprem}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_WEBHOOK_SECRET: ${MOLLIE_WEBHOOK_SECRET:-}
      MOLLIE_WEBHOOK_URL: ${MOLLIE_WEBHOOK_URL:-}
      # Tabellen-Store (ADR-0049): eine SQLite-Datei pro WorkArea unter
      # {workspace_id}/{area_id}.sqlite — die Datei ist die Isolationsgrenze,
      # read-only erzwingt die Engine (query_only + Authorizer). Persistiert
      # im Volume tablestore-data, damit Area-Tabellen Neustarts ueberleben.
      WHO2BE_TABLESTORE_DIR: /data/tablestore
    volumes:
      - tablestore-data:/data/tablestore
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # `docker compose up --wait` toleriert beendete One-Shots nur, wenn ein
      # Dienst per service_completed_successfully von ihnen abhaengt (sonst
      # Exit 1 trotz erfolgreichem Lauf) — gleiches Muster wie bei `migrate`.
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # KEINE VITE_API_BASE_URL/VITE_SUPABASE_URL mehr: die waeren
        # Compile-Time einbetoniert und haetten das Image an `localhost`
        # gebunden. Die App loest ihre URLs zur Laufzeit auf (/config.js →
        # Same-Origin, siehe apps/web/src/config.ts).
        # On-Prem (Default) → Billing-UI wird aus dem Bundle tree-shaked.
        # Cloud-Dev: VITE_WHO2BE_EDITION=cloud setzen.
        VITE_WHO2BE_EDITION: ${VITE_WHO2BE_EDITION:-onprem}
    environment:
      # Leer = Same-Origin (der nginx dieses Containers proxied /v1/ und
      # /auth/v1/). Nur setzen, wenn API/Auth unter eigenen Hosts liegen —
      # z. B. WHO2BE_API_BASE_URL=https://api.example.com.
      WHO2BE_API_BASE_URL: ${WHO2BE_API_BASE_URL:-}
      WHO2BE_SUPABASE_URL: ${WHO2BE_SUPABASE_URL:-}
      WHO2BE_SUPABASE_ANON_KEY: ${WHO2BE_SUPABASE_ANON_KEY:-}
      # Direkter MCP-HTTP-Endpoint fuer die Copy-Config in der UI. Leer ⇒ aus
      # der API-URL abgeleitet (api.→mcp.).
      WHO2BE_MCP_URL: ${WHO2BE_MCP_URL:-}
      WHO2BE_SIGNUP_DISABLED: ${WHO2BE_SIGNUP_DISABLED:-false}
    ports:
      # Container hoert mit nginx auf 80; Host-Port bleibt 5173, damit
      # smoke.sh + CORS-Origin unveraendert bleiben.
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
      # Der /auth/v1-Proxy zeigt auf den Gateway — ohne ihn liefe der Login
      # beim ersten Aufruf ins 502.
      auth-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Content-addressed Blob-Storage fuer den WorkArea-Ingest (ADR-0048).
  # MinIO ist AGPL und laeuft — wie Postgres — NUR als Container; die App
  # spricht S3 ueber das Apache-2.0-SDK `minio`. Keys: blobs/{workspace}/{sha256}.
  # Ohne WHO2BE_BLOBSTORE_*-Env in der API bleibt der Dienst ungenutzt —
  # nur Ingest/Blob-Reads liefern dann 503, alles andere laeuft.
  minio:
    # Gepinnte Release statt `latest` — Objekt-Storage-Daten sollen nicht an
    # einem impliziten Image-Sprung haengen (Stand 2026-08: aktuell-stabil).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Nur Loopback binden (Security-Review 2026-08-13 L3): der Dev-Store
      # laeuft mit Default-Credentials — er darf nie im LAN erreichbar sein.
      # Prod setzt MINIO_ROOT_PASSWORD und exponiert nur ueber Caddy/Netz.
      - "127.0.0.1:9000:9000"  # S3-API (WHO2BE_BLOBSTORE_ENDPOINT=localhost:9000)
      - "127.0.0.1:9001:9001"  # Web-Console (Login: minioadmin/minioadmin)
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc ready local` ist der von MinIO dokumentierte Compose-Check; das
      # Server-Image bringt mc samt vorkonfiguriertem `local`-Alias mit.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-Shot (Muster `set-app-role-password`, docker-compose.cloud.yml): legt
  # den Bucket `who2be-blobs` idempotent an und terminiert. Die App erstellt
  # Buckets bewusst nie selbst (ADR-0048).
  minio-bootstrap:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/who2be-blobs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
  minio-data:
  # SQLite-Dateien des Tabellen-Stores (ADR-0049), eine pro WorkArea.
  tablestore-data:
