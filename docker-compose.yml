# Lokale Entwicklungs-Infrastruktur fuer Who2Be.
# Stub — Phase 0 (Task T1) ersetzt dies durch das vollstaendige
# self-hosted-Supabase-Compose-Setup:
# https://supabase.com/docs/guides/self-hosting/docker
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: who2be
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
